id: bip-process.standards-track-renamed
statement: BIP 3 supersedes BIP 2's Standards Track type, used for changes affecting most or all
  Bitcoin implementations, with the similar Specification type. On BIP 3's activation, Standards
  Track BIPs and eligible Informational BIPs are assigned the Specification type.
