id: bip-process.process-bip-rough-consensus
statement: "Process BIPs follow a different rule for becoming Deployed: under BIP 3, a Process BIP
  moves from Complete to Deployed when it reaches rough consensus on the Bitcoin Development Mailing
  List, after its advancement has been open to discussion there for at least one month."
