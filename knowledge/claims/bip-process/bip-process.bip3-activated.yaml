id: bip-process.bip3-activated
statement: 'Optech Newsletter #382 (28 November 2025) reported a motion on the Bitcoin-Dev mailing
  list to activate BIP 3 in place of BIP 2. bitcoin/bips pull request #1820, "Process: Activate
  BIP3", which applies the changes BIP 3 prescribes on activation, was merged on 14 January 2026.'
