id: bip-process.three-types
statement: "BIP 3 defines three BIP types: a Specification BIP sets technical rules for a new
  feature or for interoperability between implementations, an Informational BIP describes a design
  issue or gives guidelines or information, and a Process BIP describes or changes a process
  surrounding Bitcoin."
