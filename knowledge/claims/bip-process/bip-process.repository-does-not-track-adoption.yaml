id: bip-process.repository-does-not-track-adoption
statement: Under BIP 3, the bitcoin/bips repository does not track sentiment about proposals or
  their adoption beyond whether a BIP is in active use. BIP 3 encourages individual Bitcoin projects
  to publish lists of the BIPs they implement.
