id: bip-process.bip9-mechanism
statement: "BIP 9 specifies version bits: miners signal readiness for a soft fork by setting a bit
  in the block version, support is tallied each 2,016-block retarget period, and on mainnet a
  deployment locks in when at least 1,916 blocks (95%) of a period signal before its timeout."
kind: mechanism
