id: bip-process.buried-deployments
statement: After a soft fork has activated, Bitcoin Core can replace its version bits deployment
  with a hardcoded activation height, called a buried deployment (BIP 90). As of Bitcoin Core master
  on 20 November 2026, CSV is buried at block 419,328 and segwit at block 481,824.
