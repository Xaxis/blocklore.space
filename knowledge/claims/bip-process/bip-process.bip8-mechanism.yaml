id: bip-process.bip8-mechanism
statement: BIP 8 is an alternative to BIP 9 version bits that uses block heights instead of
  timestamps for start and timeout, and adds a lockinontimeout flag that, when set, requires blocks
  to signal in the final period so the soft fork locks in by the timeout height.
kind: mechanism
