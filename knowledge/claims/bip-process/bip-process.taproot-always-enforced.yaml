id: bip-process.taproot-always-enforced
statement: As of Bitcoin Core master on 20 November 2026, GetBlockScriptFlags in src/validation.cpp
  turns on the P2SH, segwit and Taproot script rules for every block except two listed exceptions,
  because only one historical mainnet block violated the Taproot rules and one violated P2SH.
