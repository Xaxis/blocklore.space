id: bip-process.check-your-software
statement: Whether a wallet or node follows a given BIP depends on that software, not on the BIP.
  Bitcoin Core, for example, keeps a list of the BIPs it implements in doc/bips.md, and as of its
  master branch on 20 November 2026 that list includes BIP 32 but not BIP 39, the mnemonic seed
  phrase standard.
