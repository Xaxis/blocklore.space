id: bip-process.csv-activation
statement: "The soft fork combining BIP 68, BIP 112 and BIP 113 (often called CSV) was the first
  deployed with BIP 9 version bits: Bitcoin Core 0.12.1 signaled it on bit 0 from 1 May 2016, and
  its rules have been active on mainnet since block 419,328."
