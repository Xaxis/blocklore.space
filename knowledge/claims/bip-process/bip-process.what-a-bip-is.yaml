id: bip-process.what-a-bip-is
statement: A Bitcoin Improvement Proposal (BIP) is an improvement proposal for Bitcoin. BIP 3, the
  process document, says most BIPs give a concise, self-contained technical description of one new
  concept, feature or standard.
