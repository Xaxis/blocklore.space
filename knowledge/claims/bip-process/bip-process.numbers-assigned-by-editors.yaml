id: bip-process.numbers-assigned-by-editors
statement: Authors do not choose their own BIP numbers. Under BIP 3, only BIP Editors may assign a
  number, and a number counts as assigned only after a BIP Editor has announced it publicly in the
  proposal's pull request to the bitcoin/bips repository.
