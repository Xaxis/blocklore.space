id: bip-process.editors-role
statement: BIP Editors, as BIP 3 describes them, check editorial criteria for a new BIP, such as
  prior discussion on the Bitcoin Development Mailing List and correct Layer and Type headers, then
  assign a number and merge. BIP 3 states that editors do not evaluate whether a proposal is likely
  to be adopted.
