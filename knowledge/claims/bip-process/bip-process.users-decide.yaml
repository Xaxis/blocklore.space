id: bip-process.users-decide
statement: The bitcoin/bips repository README states that acceptance and adoption of a BIP
  ultimately rest with Bitcoin users, and BIP 3 says that once a BIP is Complete it is up to the
  Bitcoin community to evaluate, adopt, ignore or reject it.
