id: bip-process.number-not-adoption
statement: A BIP number does not mean Bitcoin adopted a proposal. The bitcoin/bips README says
  publishing a BIP there shows it is in scope and met formal criteria, but not that it is a good
  idea, has community consensus or is about to be adopted.
kind: fact
topics:
  - bip-process
depth: user
status: established
confidence: medium
