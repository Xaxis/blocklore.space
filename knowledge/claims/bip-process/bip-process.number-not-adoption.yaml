    url: https://github.com/bitcoin/bips/blob/a7f91321f25b5be8d93e901775621c21519e80b7/bip-0003.md
    locator: Fundamentals, What is the Significance of BIPs?
    quote: "BIPs do not define what Bitcoin is: individual BIPs do not represent Bitcoin community
      consensus"
    accessed: 2026-11-20
    supports: direct
