id: halvings-and-supply.shift-guard-bip42
statement: BIP 42 noted that Bitcoin's subsidy code shifted by the halving count, a shift undefined
  in C++ from 64 on, so the subsidy could repeat its cycle every 64 halvings. Bitcoin Core's
  GetBlockSubsidy now returns zero from 64 halvings on, keeping the supply finite.
