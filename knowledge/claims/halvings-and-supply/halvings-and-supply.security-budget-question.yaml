id: halvings-and-supply.security-budget-question
statement: "Will transaction fees pay Bitcoin miners enough to keep the network secure as the block
  subsidy falls toward zero? This security budget question is debated: informed people disagree on
  how large the budget must be and whether any protocol change is warranted. Fee revenue observed
  over future halvings would inform it."
