id: halvings-and-supply.fee-share-of-revenue
statement: A 2026 Cambridge Centre for Alternative Finance report found that transaction fees
  averaged 0.67% of Bitcoin miner revenue in the 90 days to 4 October 2026, the rest coming from the
  block subsidy, and that fees had rarely exceeded 5% of miner revenue since 2010.
