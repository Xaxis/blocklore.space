id: halvings-and-supply.unspendable-amounts
statement: "Bitcoin Core's gettxoutsetinfo RPC, with the coinstatsindex enabled, reports bitcoin
  permanently excluded from the UTXO set in four categories: the genesis block subsidy, coinbases
  overwritten by duplicates before BIP 30, outputs to unspendable scripts such as OP_RETURN, and
  rewards miners did not claim."
