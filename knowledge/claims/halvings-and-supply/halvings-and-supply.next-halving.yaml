id: halvings-and-supply.next-halving
statement: Bitcoin's fifth halving is set by the 210,000-block interval to take effect at block
  1,050,000, cutting the block subsidy from 3.125 BTC to 1.5625 BTC. As of block 976,751, that
  height is 73,249 blocks away.
