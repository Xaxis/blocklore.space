id: halvings-and-supply.bip30-overwritten-coinbases
statement: The 50 BTC coinbase outputs of blocks 91,722 and 91,812 can never be spent, because
  identical coinbases mined later, in blocks 91,842 and 91,880, overwrote them. Bitcoin Core marks
  them in IsBIP30Unspendable, and gettxoutsetinfo with coinstatsindex reports them in its bip30
  total.
