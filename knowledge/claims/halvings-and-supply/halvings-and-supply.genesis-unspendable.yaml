id: halvings-and-supply.genesis-unspendable
statement: "The 50 BTC coinbase of Bitcoin's genesis block cannot be spent: Bitcoin Core skips
  connecting the genesis block's transactions, so that output never enters the UTXO set, and
  gettxoutsetinfo lists it as unspendable."
