id: halvings-and-supply.bip30-duplicate-coinbases
statement: Blocks 91,842 and 91,880 contain coinbase transactions identical to earlier ones, which
  was possible before BIP 30 because early coinbases were easy to duplicate. BIP 30 forbids such
  duplicates in all blocks except these two, and Bitcoin Core exempts them in IsBIP30Repeat.
