id: halvings-and-supply.exact-supply-needs-node
statement: "The amount of bitcoin in existence is not a function of block height alone, because some
  allowed rewards were never claimed and some issued coins are provably unspendable. A Bitcoin Core
  node reports the total from its own UTXO set: the gettxoutsetinfo RPC returns total_amount, the
  total of all unspent outputs."
