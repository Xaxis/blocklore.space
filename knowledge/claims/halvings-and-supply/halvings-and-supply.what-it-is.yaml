id: halvings-and-supply.what-it-is
statement: "New bitcoin enter circulation only through the block subsidy: a fixed amount the miner
  of each block may pay itself, on top of the block's transaction fees. Bitcoin's rules cut the
  subsidy in half every 210,000 blocks, an event called a halving."
