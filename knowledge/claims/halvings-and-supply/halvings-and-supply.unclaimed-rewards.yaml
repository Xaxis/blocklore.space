id: halvings-and-supply.unclaimed-rewards
statement: Bitcoin's consensus rules cap a coinbase's claim at subsidy plus fees but set no minimum,
  so a miner can claim less. An amount left unclaimed is never paid to anyone, and Bitcoin Core's
  gettxoutsetinfo reports such amounts under unclaimed_rewards.
