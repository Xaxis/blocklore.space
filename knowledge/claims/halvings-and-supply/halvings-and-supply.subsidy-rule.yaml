id: halvings-and-supply.subsidy-rule
statement: "Bitcoin Core computes the block subsidy in GetBlockSubsidy (src/validation.cpp): it
  divides the height by nSubsidyHalvingInterval, which mainnet sets to 210,000, and shifts 50 BTC,
  expressed in satoshis, right by that many halvings."
