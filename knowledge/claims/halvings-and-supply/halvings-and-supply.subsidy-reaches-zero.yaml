id: halvings-and-supply.subsidy-reaches-zero
statement: Because Bitcoin's 50 BTC starting subsidy is 5,000,000,000 sats, shifting it right 32
  times leaves 1 sat and 33 times leaves 0. The subsidy is therefore 1 sat for blocks 6,720,000 to
  6,929,999 and zero from block 6,930,000 on.
