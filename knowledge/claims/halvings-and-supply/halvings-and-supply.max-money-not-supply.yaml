id: halvings-and-supply.max-money-not-supply
statement: "Bitcoin Core's MAX_MONEY constant of 21,000,000 BTC is a sanity check on amounts, not
  the total money supply: its source comment says the supply in Bitcoin currently happens to be less
  than 21,000,000 BTC for various reasons."
