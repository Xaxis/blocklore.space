id: halvings-and-supply.bip54-future-duplicates
statement: "BIP 34 does not rule out every duplicate coinbase: some early coinbases could be
  replayed in future blocks, so Bitcoin Core enforces BIP 30 checks again from block 1,983,702 on.
  BIP 54 (consensus cleanup), a proposed soft fork whose BIP status is Complete as of 20 November
  2026, specifies that each coinbase's nLockTime equal the block height minus 1."
