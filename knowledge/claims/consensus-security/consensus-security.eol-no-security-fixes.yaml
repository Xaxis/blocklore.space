id: consensus-security.eol-no-security-fixes
statement: Bitcoin Core's lifecycle page, as read on 24 November 2026, says major versions past
  their end of life do not generally receive security fixes, and recommends running the latest
  maintenance release of the newest major version a user is able to upgrade to.
