id: consensus-security.max-money-sanity-check
statement: Bitcoin Core treats any amount above 21,000,000 BTC (MAX_MONEY) as invalid and rejects a
  transaction whose outputs add up to more than that. Its source code comment calls this constant a
  sanity check rather than the total money supply, and says its exact value is consensus critical.
