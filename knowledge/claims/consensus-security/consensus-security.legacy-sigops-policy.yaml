id: consensus-security.legacy-sigops-policy
statement: "Bitcoin Core PR #32521 made transactions with more than 2,500 potentially executed
  legacy signature operations non-standard, so Bitcoin Core does not relay or mine them by default;
  the limit is MAX_TX_LEGACY_SIGOPS in src/policy/policy.h as of commit dbe9eac."
