id: consensus-security.bip66-activation-height
statement: Under BIP 66's deployment rules, its strict DER rules applied to version 3 blocks once at
  least 750 of the preceding 1,000 blocks were version 3. Bitcoin Core's mainnet parameters record
  BIP 66 as enforced from block 363,725.
