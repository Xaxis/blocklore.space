id: consensus-security.slow-validation-what-it-is
statement: A slow-validation block is a block built with unusual scripts so that it takes nodes a
  very long time to check. BIP 54 states that such specially crafted blocks can take up to several
  minutes to validate even on high-end devices, and up to a few hours on lower-end devices.
