id: consensus-security.bip54-overview
statement: BIP 54 (Consensus Cleanup) is a soft fork specification proposing new consensus rules to
  fix the timewarp attack, reduce worst-case block validation time, forbid 64-byte transactions and
  prevent duplicate coinbase transactions. Its status in the BIPs repository is Complete as of block
  977,304.
