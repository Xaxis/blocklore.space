id: consensus-security.chain-split-definition
statement: "BIP 50 records a chain split in March 2013: a block with a larger number of total
  transaction inputs than previously seen was accepted by Bitcoin 0.8 nodes but rejected by some
  pre-0.8 nodes, causing an unexpected fork of the blockchain."
