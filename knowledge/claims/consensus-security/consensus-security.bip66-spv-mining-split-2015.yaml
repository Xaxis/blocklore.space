id: consensus-security.bip66-spv-mining-split-2015
statement: On 4 July 2015, after BIP 66 reached its 950 of 1,000 block (95%) threshold, miners that
  built on blocks without fully validating them (SPV mining) extended an invalid block. The
  bitcoin.org alert said users of Bitcoin Core 0.9.5 or later were unaffected.
