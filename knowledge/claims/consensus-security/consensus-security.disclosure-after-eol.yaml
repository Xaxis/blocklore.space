id: consensus-security.disclosure-after-eol
statement: Under Bitcoin Core's security disclosure policy, as read on 24 November 2026, details of
  Medium and High severity vulnerabilities are published 2 weeks after the last affected release
  reaches end of life, so versions past end of life can carry weaknesses whose details are public.
