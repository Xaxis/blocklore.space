id: consensus-security.bip50-root-cause
statement: BIP 50 traces the March 2013 chain split to Bitcoin versions before 0.8, which configured
  too few Berkeley DB locks to process some large but valid blocks. That database limit had
  implicitly become a consensus rule deciding which blocks were valid.
