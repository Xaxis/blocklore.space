id: consensus-security.bip66-motivation
statement: BIP 66 (Strict DER signatures), status Deployed, requires signatures to use strict DER
  encoding. Its motivation is that consensus depended on OpenSSL's signature parsing, and when
  OpenSSL 1.0.0p and 1.0.1k changed that parsing, some nodes rejected the chain.
