id: consensus-security.value-overflow-fix-2010
statement: The fix for the block 74,638 overflow, commit d4c6b90 from trunk revision 132, added a
  MAX_MONEY constant of 21,000,000 BTC to main.h and made CheckTransaction reject a transaction
  whose single output or output total exceeded it.
