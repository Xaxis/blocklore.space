id: consensus-security.bip50-resolution
statement: According to BIP 50, the Bitcoin 0.8 side of the March 2013 split had around 60% of
  mining hash power, so the split did not resolve by itself; the BTCGuild and Slush mining pools
  downgraded their nodes to 0.7 to restore a single chain.
