id: consensus-security.bip54-64-byte-transactions
statement: BIP 54 would make transactions whose witness-stripped serialized size is exactly 64 bytes
  invalid, so that a block transaction can no longer be passed off as an inner node of a block's
  merkle tree, the weakness behind CVE-2017-12842.
