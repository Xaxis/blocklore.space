id: consensus-security.value-overflow-2010
statement: On 15 August 2010, block 74,638 held a transaction that created 184,467,440,737.09551616
  BTC (about 184 billion bitcoin) for three addresses. An integer overflow made the transaction's
  total look negative, so the node software of the time accepted it. A fixed client was out within
  five hours.
