id: p2p-network.heilman-2015
statement: In 2015, Ethan Heilman, Alison Kendler, Aviv Zohar and Sharon Goldberg published a paper
  presenting eclipse attacks on Bitcoin's peer-to-peer network, in which an adversary controlling
  enough IP addresses monopolizes all of a victim node's connections, and proposing countermeasures.
