id: p2p-network.header-spam-what
statement: Because Bitcoin Core keeps block headers in memory, before Bitcoin Core 24.0.1 a peer
  could send long chains of low-difficulty headers to exhaust a node's memory, a denial-of-service
  issue tracked as CVE-2019-25220.
