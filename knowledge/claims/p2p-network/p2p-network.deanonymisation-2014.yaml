id: p2p-network.deanonymisation-2014
statement: In a 2014 paper, Alex Biryukov, Dmitry Khovratovich and Ivan Pustogarov presented a
  method to deanonymize Bitcoin users by linking their pseudonyms to IP addresses observed on
  Bitcoin's peer-to-peer network.
