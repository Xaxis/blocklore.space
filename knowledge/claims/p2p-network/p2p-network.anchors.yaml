id: p2p-network.anchors
statement: "Since Bitcoin Core 0.21.0 (PR #17428), a node saves the addresses of its two outbound
  block-relay-only peers, called anchors, to anchors.dat at a clean shutdown and tries to reconnect
  to them on restart, which the release notes say prevents an attacker from using restarts to
  trigger a complete change of peers as part of an eclipse attack."
