id: p2p-network.headers-presync-two-passes
statement: "Bitcoin Core's headers sync, implemented in the HeadersSyncState class, downloads a
  peer's headers twice: a presync pass that keeps only 1 bit of a salted hash for some headers, then
  a redownload pass that checks headers against those stored bits before accepting them."
