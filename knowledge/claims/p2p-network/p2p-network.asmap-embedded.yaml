id: p2p-network.asmap-embedded
statement: Bitcoin Core 31.0 was the first release with asmap data embedded, so its asmap feature,
  which groups peers by Autonomous System Number, can be used without an externally sourced file;
  the option still stays off by default and must be set with -asmap or -asmap=1.
