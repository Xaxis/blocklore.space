id: p2p-network.block-stalling-what
statement: Before Bitcoin Core 25.1, a peer that announced a new block but did not deliver it could
  make a node wait up to 10 minutes before disconnecting that peer and retrying, which hindered
  block propagation (CVE-2024-52922).
