id: p2p-network.routing-attack-delay
statement: 'The paper "Hijacking Bitcoin: Routing Attacks on Cryptocurrencies" says that by
  isolating parts of the network or delaying block propagation, routing attackers can cause a
  significant amount of mining power to be wasted, and it proposes both short and long-term
  countermeasures.'
