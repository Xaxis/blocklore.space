id: p2p-network.tx-trickle
statement: As of Bitcoin Core commit afedb19, the average delay between trickled inventory
  transmissions, which announce transactions to peers, is 5 seconds for inbound peers and 2 seconds
  for outbound peers; a code comment says the smaller delay is used for outbound peers because there
  is less privacy concern for them.
