id: p2p-network.i2p-support
statement: Since Bitcoin Core 22.0, a node can run as an I2P (Invisible Internet Project) service
  and connect to other I2P nodes through an I2P router's SAM proxy, though its documentation notes
  there may be fewer I2P peers than Tor or IP ones.
