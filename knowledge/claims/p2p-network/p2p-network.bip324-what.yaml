id: p2p-network.bip324-what
statement: BIP 324 specifies version 2 of Bitcoin's peer-to-peer transport protocol, which adds
  opportunistic encryption and makes the bytes on the wire pseudorandom, indistinguishable from
  uniformly random bytes to a passive eavesdropper.
