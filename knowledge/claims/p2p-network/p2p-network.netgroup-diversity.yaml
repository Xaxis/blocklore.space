id: p2p-network.netgroup-diversity
statement: As of block 977,293, Bitcoin Core makes its automatic outbound IPv4 and IPv6 connections,
  other than short-lived feeler connections, to distinct network groups (a /16 range for IPv4 unless
  asmap is in use). A code comment says the groups are assigned so that it should be costly for an
  attacker to obtain addresses in many different groups.
