id: p2p-network.private-broadcast
statement: "Since Bitcoin Core 31.0 (PR #29415), an experimental private broadcast option
  (-privatebroadcast) sends transactions submitted through the sendrawtransaction RPC over
  short-lived Tor or I2P connections, which its help text calls best-effort concealment of the
  transaction's origin; transactions submitted through the wallet are not affected."
