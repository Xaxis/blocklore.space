id: p2p-network.socks-overflow
statement: CVE-2017-18350 was a buffer overflow in Bitcoin Core, in code first released in 0.7.0rc1
  in August 2012, that let a malicious SOCKS proxy server overwrite the program stack on some
  systems; according to the project's advisory, Bitcoin Core 0.15.1 was released with a fix.
