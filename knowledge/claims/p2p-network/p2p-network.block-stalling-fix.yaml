id: p2p-network.block-stalling-fix
statement: "Bitcoin Core PR #27626, released in Bitcoin Core 26.0 and backported to 25.1, lets a
  node request a new block concurrently from up to 3 high-bandwidth compact block peers, which
  mitigates the stalling issue CVE-2024-52922."
