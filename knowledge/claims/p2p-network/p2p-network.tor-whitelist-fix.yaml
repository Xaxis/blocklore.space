id: p2p-network.tor-whitelist-fix
statement: "Bitcoin Core PR #33395 stopped considering inbound Tor peers when applying -whitelist
  permissions, so the whitelist's lifted DoS limits no longer extend to them; it was backported and
  released in Bitcoin Core 30.0, 29.2 and 28.3, fixing CVE-2025-62860."
