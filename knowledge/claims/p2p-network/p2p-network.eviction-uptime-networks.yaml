id: p2p-network.eviction-uptime-networks
statement: As of block 977,868, Bitcoin Core's eviction logic protects half of the remaining
  eviction candidates that have been connected longest, and to favor diverse connections reserves up
  to half of those protected spots for Tor (onion), localhost, I2P and CJDNS peers even if they lack
  the longest uptime.
