id: p2p-network.peer-dos-orphans
statement: Before Bitcoin Core 0.18.0, a specially crafted unconfirmed transaction could stall a
  node for hours while it processed that transaction's orphans, an issue (CVE-2024-52914) the
  project rates High severity.
