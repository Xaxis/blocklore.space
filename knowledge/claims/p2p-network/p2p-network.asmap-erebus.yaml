id: p2p-network.asmap-erebus
statement: As of block 977,868, a comment in Bitcoin Core's src/netgroup.h says that if an asmap is
  provided, nodes are bucketed by the autonomous system they belong to in response to the Erebus
  attack, and also to diversify connections generally, especially when a large fraction of nodes
  operate under a couple of cloud providers.
