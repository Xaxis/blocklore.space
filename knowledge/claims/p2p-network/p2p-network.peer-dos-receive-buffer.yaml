id: p2p-network.peer-dos-receive-buffer
statement: Before Bitcoin Core 0.10.1, a peer could force a node to allocate up to 32 MiB of memory
  per connection for a received message, which could crash the node by exhausting its memory, a
  denial-of-service issue (CVE-2015-3641) the project rates Medium severity.
