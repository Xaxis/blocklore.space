id: p2p-network.tx-rerequest-censorship
statement: Before Bitcoin Core 0.21.0, an attacking peer could prevent a node from seeing a specific
  unconfirmed transaction through a flaw in the node's handling of transaction re-requests, an issue
  (CVE-2024-52913) the project rates Medium severity; Bitcoin Core 0.21.0 was released with a fix.
