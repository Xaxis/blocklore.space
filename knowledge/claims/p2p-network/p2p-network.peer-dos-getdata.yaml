id: p2p-network.peer-dos-getdata
statement: In one disclosed peer denial-of-service bug, CVE-2024-52920, a malformed GETDATA message
  could send a node running Bitcoin Core before 0.20.0 into an infinite loop that used 100% of one
  thread's CPU and stopped progress on that connection; the project rates it Low severity.
