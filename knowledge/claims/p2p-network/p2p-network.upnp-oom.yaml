id: p2p-network.upnp-oom
statement: Before Bitcoin Core 22.0, an infinite loop bug in the miniupnp library (CVE-2024-52917,
  rated Low severity) let an attacker on the local network pose as a UPnP device and keep sending
  M-SEARCH replies until a node running with UPnP turned on, which is off by default, ran out of
  memory.
