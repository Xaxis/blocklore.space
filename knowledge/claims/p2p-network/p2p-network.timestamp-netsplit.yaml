id: p2p-network.timestamp-netsplit
statement: Before Bitcoin Core 0.21.0, two bugs in processing peers' version messages let an
  attacker among the first 200 peers to connect bypass the maximum time adjustment limit, so the
  victim could reject new blocks as dated too far in the future, a network split risk
  (CVE-2024-52912) rated Medium severity.
