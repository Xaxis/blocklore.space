id: p2p-network.asmap-option
statement: Bitcoin Core 0.20.0 added an experimental -asmap option that maps peers' IP addresses to
  Autonomous System Numbers (ASNs) and limits connections to any single ASN, to diversify a node's
  connections. The legacy grouping by /16 IP prefix stayed the default.
