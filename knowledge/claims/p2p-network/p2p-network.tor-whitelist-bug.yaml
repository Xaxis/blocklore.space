id: p2p-network.tor-whitelist-bug
statement: Before Bitcoin Core 28.3, 29.2 and 30.0, a node whose -whitelist IP range matched the
  address of its Tor daemon also gave whitelist permissions, which lift various DoS limits and
  privacy leak mitigations, to inbound Tor peers, because their IP address is that of the Tor daemon
  (CVE-2025-62860, rated Medium severity).
