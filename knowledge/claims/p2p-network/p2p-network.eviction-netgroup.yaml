id: p2p-network.eviction-netgroup
statement: As of block 977,293, Bitcoin Core's SelectNodeToEvict, after protecting some inbound
  peers by criteria such as low ping time, recent relay and uptime, selects for eviction the most
  recently connected peer of the network group with the most remaining connections (only among peers
  marked for preferred eviction, if any are), so a network range holding many unprotected inbound
  slots loses one first.
