id: p2p-network.peer-dos-banlist
statement: In CVE-2020-14198, rated High severity, Bitcoin Core kept a list of banned IP addresses
  with no size limit that an adversary could manipulate, and performed a quadratic operation on it,
  which could lead to an out-of-memory crash and CPU denial of service; Bitcoin Core 0.20.1 was
  released with the fix.
