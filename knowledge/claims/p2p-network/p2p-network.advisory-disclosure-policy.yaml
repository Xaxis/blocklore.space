id: p2p-network.advisory-disclosure-policy
statement: As of November 2026, the Bitcoin Core project's disclosure policy says Medium and High
  severity vulnerabilities are disclosed 2 weeks after the last affected release reaches end of
  life, except vulnerabilities it classes as easily discoverable, which get a fixed point release
  and an advisory as soon as possible.
