id: p2p-network.headers-presync
statement: "Since Bitcoin Core 24.0.1, headers presync (Bitcoin Core PR #25717) makes a node check
  that a peer's chain of block headers has enough cumulative proof of work before storing it, which
  fixed the low-difficulty headers memory issue CVE-2019-25220."
