id: p2p-network.routing-attack-what
statement: "In \"Hijacking Bitcoin: Routing Attacks on Cryptocurrencies\", listed as to appear at
  the IEEE Symposium on Security and Privacy in May 2017, Maria Apostolaki, Aviv Zohar and Laurent
  Vanbever reported that any network attacker could hijack fewer than 100 BGP prefixes to isolate
  about 50% of Bitcoin's mining power."
