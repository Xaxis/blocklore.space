id: p2p-network.bip324-passive-observers
statement: BIP 324's encryption is meant to stop passive network observers from reading Bitcoin peer
  traffic, forcing an eavesdropper to become active; the specification does not include a way to
  authenticate peers, so it does not by itself stop an active man-in-the-middle.
