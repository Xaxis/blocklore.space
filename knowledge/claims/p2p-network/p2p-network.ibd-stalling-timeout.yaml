id: p2p-network.ibd-stalling-timeout
statement: "Bitcoin Core PR #25880 made the block download stalling timeout during initial block
  download adaptive: after disconnecting one of its stalling peers, the node doubles the timeout for
  the next peer. As of block 977,868 the code sets a 2 second default and a 64 second maximum."
