id: p2p-network.upnp-overflow
statement: A buffer overflow in the miniupnpc library, the UPnP library Bitcoin Core used, enabled a
  significant data leak (CVE-2015-20111, rated Medium severity); according to the Bitcoin Core
  project's advisory, the fix was released as part of Bitcoin Core 0.12.
