id: utxo-model.double-spend-check
statement: Bitcoin nodes accept a block only if every transaction in it is valid and spends outputs
  that are still unspent. Bitcoin Core rejects a transaction whose inputs are missing or already
  spent, which is how the UTXO model stops the same coins being spent twice.
