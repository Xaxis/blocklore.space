id: utxo-model.coinbase-maturity
statement: Outputs of a Bitcoin coinbase transaction, which pays the block reward, cannot be spent
  until 100 more blocks have been mined. Bitcoin Core enforces this consensus rule with
  COINBASE_MATURITY set to 100 blocks, checked in Consensus::CheckTxInputs.
