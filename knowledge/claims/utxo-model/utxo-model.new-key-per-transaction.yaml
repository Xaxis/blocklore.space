id: utxo-model.new-key-per-transaction
statement: The Bitcoin white paper recommends a new key pair for each transaction, as an additional
  firewall that keeps transactions from being linked to a common owner. Bitcoin Optech groups such
  methods of limiting output linking under the name reuse avoidance.
