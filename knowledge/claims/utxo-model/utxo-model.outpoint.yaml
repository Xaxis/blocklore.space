id: utxo-model.outpoint
statement: "A Bitcoin transaction input names the output it spends by an outpoint: the transaction
  id of the earlier transaction plus a 32-bit index into that transaction's list of outputs,
  represented in Bitcoin Core by the COutPoint class."
