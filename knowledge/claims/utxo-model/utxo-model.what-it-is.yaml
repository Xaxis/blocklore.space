id: utxo-model.what-it-is
statement: "Bitcoin does not keep account balances. It records ownership as unspent transaction
  outputs (UTXOs): each output is an amount of bitcoin locked to a condition, usually a signature
  from a particular key, that stays spendable until a later transaction consumes it."
