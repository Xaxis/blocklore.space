id: utxo-model.fee-is-difference
statement: "A Bitcoin transaction's fee is not written as a separate field: it is the amount by
  which the total value of its inputs exceeds the total value of its outputs, and Bitcoin Core
  rejects a transaction whose outputs are worth more than its inputs."
