id: utxo-model.bip34-limit
statement: Bitcoin Core relies on BIP 34 to skip BIP 30 duplicate-transaction lookups only below
  block 1,983,702, its constant BIP34_IMPLIES_BIP30_LIMIT; from that height on it enforces the BIP
  30 check again, because some coinbase transactions from before BIP 34 could otherwise be repeated.
