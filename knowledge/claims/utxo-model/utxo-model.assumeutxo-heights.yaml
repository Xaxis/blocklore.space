id: utxo-model.assumeutxo-heights
statement: As of block 976,753, Bitcoin Core's master branch hardcodes assumeutxo snapshot hashes
  for five mainnet heights (840,000, 880,000, 910,000, 935,000 and 965,000) in m_assumeutxo_data,
  and a node checks that a loaded snapshot matches the compiled value once background validation
  reaches it.
