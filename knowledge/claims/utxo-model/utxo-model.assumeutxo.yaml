id: utxo-model.assumeutxo
statement: "Assumeutxo is a way to bootstrap a Bitcoin full node from a snapshot of the UTXO set,
  postponing verification of old block history: the node uses the snapshot right away and downloads
  and verifies the older blocks in the background."
