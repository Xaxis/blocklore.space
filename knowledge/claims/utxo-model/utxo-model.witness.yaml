id: utxo-model.witness
statement: Since segregated witness (BIP 141), the data that unlocks a Bitcoin output can sit in a
  separate witness structure that the transaction id does not cover; Bitcoin Core stores it with
  each input as scriptWitness, beside the older scriptSig.
