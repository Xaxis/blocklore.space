id: utxo-model.utreexo
statement: "Utreexo is a proposed alternative to storing the full UTXO set: a node keeps a
  hash-based accumulator whose size grows logarithmically with the set, and transactions carry
  inclusion proofs showing that the outputs they spend are in it."
