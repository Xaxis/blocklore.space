id: utxo-model.bip30
statement: BIP 30 forbids a Bitcoin block from containing a transaction whose txid matches an
  earlier transaction in the same chain that still has unspent outputs, closing a flaw in which a
  duplicate transaction could overwrite the earlier one's unspent outputs.
