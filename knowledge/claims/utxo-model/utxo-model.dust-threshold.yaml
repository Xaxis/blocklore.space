id: utxo-model.dust-threshold
statement: As of block 976,753, Bitcoin Core's default relay policy calls an output dust when
  spending it would cost more in fees than it is worth at the default dust feerate of 3,000 sats per
  1,000 vB, which puts the threshold at 546 sats for a typical non-segwit output and 294 sats for a
  P2WPKH output.
