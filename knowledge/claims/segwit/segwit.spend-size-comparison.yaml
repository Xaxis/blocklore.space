id: segwit.spend-size-comparison
statement: For a typical transaction with one input and two outputs, Bitcoin Optech calculated in
  April 2019 that spending a native SegWit (P2WPKH) output takes 141 vbytes against 220 vbytes for a
  legacy P2PKH output, about 35% less, so the same fee rate in sat/vB costs less in total.
