id: segwit.core-default-bech32
statement: As of block 976,753, the default for Bitcoin Core's -addresstype wallet option is bech32
  (native SegWit); the Bitcoin Core 0.20.0 release notes record the change that made the wallet use
  bech32 addresses by default when used through RPC and create native SegWit change outputs.
