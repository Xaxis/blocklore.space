id: segwit.witness-program
statement: "In BIP 141, an output script (or P2SH redeem script) made of a 1-byte push opcode from
  OP_0 to OP_16 followed by a single direct data push of 2 to 40 bytes has a special meaning: the
  first push is the version byte and the pushed bytes are the witness program."
