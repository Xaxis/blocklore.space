id: segwit.bip143-sighash
statement: BIP 143 defines a new signature hash for SegWit version 0 inputs that reduces redundant
  hashing during verification, avoiding legacy signature hashing's quadratic growth, and that
  commits to the input amount; Bitcoin Core implements it in SignatureHash for
  SigVersion::WITNESS_V0.
