id: segwit.what-it-is
statement: Segregated Witness (SegWit) is a Bitcoin soft fork, activated in 2017, that moves the
  signature data of a transaction (its "witness") into a separate structure that blocks commit to
  apart from the transaction data that the transaction ID covers.
