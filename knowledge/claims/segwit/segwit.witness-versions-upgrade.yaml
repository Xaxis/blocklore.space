id: segwit.witness-versions-upgrade
statement: BIP 141 reserves witness versions 1 to 16 for future extensions and leaves their programs
  uninterpreted, so nodes that predate a new version accept its spends; later soft forks can then
  give a version new rules without breaking older nodes.
kind: mechanism
