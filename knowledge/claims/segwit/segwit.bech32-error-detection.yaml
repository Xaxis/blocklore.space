id: segwit.bech32-error-detection
statement: BIP 173 states that the Bech32 checksum used by native SegWit addresses guarantees
  detection of any error affecting at most 4 characters; BIP 350 later described a weakness with
  inserted or deleted characters, which it says does not affect version 0 addresses because they are
  restricted to two specific lengths.
