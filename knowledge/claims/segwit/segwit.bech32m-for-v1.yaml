id: segwit.bech32m-for-v1
statement: BIP 350 keeps the original Bech32 encoding for SegWit version 0 addresses (P2WPKH and
  P2WSH) and specifies a modified checksum, Bech32m, for addresses of witness version 1 and later,
  such as Taproot addresses.
kind: fact
