id: segwit.txid-and-wtxid
statement: "Under BIP 141 every transaction has two identifiers: the txid, the double SHA-256 of the
  serialization without witness data (unchanged from before SegWit), and the wtxid, the double
  SHA-256 of the serialization that includes the witness."
