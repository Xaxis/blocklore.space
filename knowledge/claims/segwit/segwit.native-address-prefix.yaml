id: segwit.native-address-prefix
statement: Native SegWit version 0 addresses on the Bitcoin mainnet use the Bech32 format defined in
  BIP 173 and start with "bc1q", for example the BIP's sample P2WPKH address
  bc1qw508d6qejxtdg4y5r3zarvary0c5xw7kv8f3t4; BIP 173 requires encoders to output them in lowercase.
