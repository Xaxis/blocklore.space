id: segwit.taproot-is-v1
statement: "Taproot (BIP 341) defines rules for SegWit witness version 1: a Taproot output is a
  native SegWit output with witness version 1 and a 32-byte program, which Bitcoin Core checks in
  VerifyWitnessProgram."
