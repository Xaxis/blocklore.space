id: segwit.buried-deployment
statement: "Bitcoin Core PR #16060, merged on 15 August 2019, replaced SegWit's BIP 9 deployment
  logic with a hardcoded activation height (\"burying\" the deployment); as of block 976,753,
  Bitcoin Core's mainnet parameters carry SegwitHeight = 481824 rather than version-bits parameters
  for SegWit."
