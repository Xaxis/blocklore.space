id: segwit.witness-commitment
statement: A SegWit block commits to its witness data through a commitment in an output script of
  its coinbase transaction; Bitcoin Core verifies it in CheckWitnessMalleation in src/validation.cpp
  and rejects a mismatching block with the reason "bad-witness-merkle-match".
