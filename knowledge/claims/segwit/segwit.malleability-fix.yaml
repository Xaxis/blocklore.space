id: segwit.malleability-fix
statement: Because a SegWit transaction's signatures sit in the witness, which the txid does not
  cover, changing how the transaction was signed no longer changes its txid; BIP 141 states this
  prevents involuntary malleability for any type of script as long as all inputs are signed.
