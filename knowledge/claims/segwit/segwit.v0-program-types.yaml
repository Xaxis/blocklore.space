id: segwit.v0-program-types
statement: A version 0 witness program with a 20-byte program is a pay-to-witness-public-key-hash
  (P2WPKH) output and one with a 32-byte program is a pay-to-witness-script-hash (P2WSH) output;
  Bitcoin Core checks these sizes in VerifyWitnessProgram in src/script/interpreter.cpp.
