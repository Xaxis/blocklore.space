id: segwit.bip9-deployment
statement: "SegWit was deployed with BIP 9 version bits on bit 1, with a mainnet signaling window
  from 15 November 2016 to 15 November 2017: if 95% of blocks in a 2,016-block retarget period
  signaled, it would lock in, and activate 2,016 blocks later."
