id: segwit.bip144-p2p
statement: "BIP 144 specifies how SegWit data travels between nodes: an extended transaction
  serialization with a zero marker byte and a nonzero flag byte, new getdata types for requesting
  witness data, and a service bit with which a node signals it can serve witnesses."
