id: segwit.unknown-versions-policy
statement: In Bitcoin Core's VerifyWitnessProgram, when the
  SCRIPT_VERIFY_DISCOURAGE_UPGRADABLE_WITNESS_PROGRAM flag is set, a spend of a witness program with
  a not-yet-defined version fails with an error instead of succeeding as it does under consensus
  rules alone.
