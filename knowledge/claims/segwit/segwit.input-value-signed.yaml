id: segwit.input-value-signed
statement: Under BIP 143, each signature on a SegWit version 0 input commits to the amount of the
  input it signs, which BIP 143 says lets an offline signing device learn that amount from an
  untrusted source; Bitcoin Optech reported in June 2020 that this proved insufficient against a fee
  overpayment attack on multi-input transactions.
