id: segwit.lightning-funding-p2wsh
statement: The Lightning specification (BOLT 3) requires a channel's funding output to be a SegWit
  pay-to-witness-script-hash (P2WSH) output locking a 2-of-2 multisignature script of the two
  parties' funding keys.
