id: taproot.exception-block
statement: Bitcoin Core's mainnet parameters exempt block 692,261, mined in July 2021 before Taproot
  activated, from Taproot script verification, checking it only with the P2SH and SegWit script
  flags, because that block fails the Taproot rules.
