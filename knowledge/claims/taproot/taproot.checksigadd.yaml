id: taproot.checksigadd
statement: BIP 342 Tapscript disables OP_CHECKMULTISIG and OP_CHECKMULTISIGVERIFY and adds
  OP_CHECKSIGADD (opcode 0xba), which checks one signature and adds the result to a running count,
  so threshold scripts check signatures one at a time.
