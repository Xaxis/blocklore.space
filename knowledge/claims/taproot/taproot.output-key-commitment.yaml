id: taproot.output-key-commitment
statement: For a Taproot output with a script tree, the output key is an internal public key tweaked
  with the tree's Merkle root, and Bitcoin Core checks a script path spend in
  VerifyTaprootCommitment by recomputing that root and verifying the tweak.
