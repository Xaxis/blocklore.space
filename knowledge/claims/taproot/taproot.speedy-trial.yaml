id: taproot.speedy-trial
statement: "Taproot was activated with Speedy Trial, a variant of BIP 9 version bits signaling: if
  90% of blocks (1,815 of 2,016) in a retarget period signaled on bit 2 between 24 April and 11
  August 2021, Taproot would lock in and then activate no earlier than block 709,632."
