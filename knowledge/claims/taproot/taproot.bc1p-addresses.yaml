id: taproot.bc1p-addresses
statement: On Bitcoin mainnet, a Taproot (P2TR) address starts with "bc1p" and is 62 characters
  long, and it is encoded with bech32m, the address format BIP 350 defines for SegWit version 1 and
  later outputs.
