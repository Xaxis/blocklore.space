id: taproot.three-bips
statement: "The Taproot soft fork consists of three BIPs deployed together: BIP 340 for Schnorr
  signatures, BIP 341 for the spending rules of SegWit version 1 outputs, and BIP 342 for Tapscript,
  the script language used inside Taproot."
