id: taproot.op-success
statement: "BIP 342 renames opcode numbers 80, 98, 126 to 129, 131 to 134, 137, 138, 141, 142, 149
  to 153 and 187 to 254 as OP_SUCCESSx: if a Tapscript contains any of them, validation succeeds
  without applying the other rules, which BIP 342 describes as a mechanism to upgrade the Script
  system."
