id: taproot.control-block
statement: "In a Taproot script path spend, the last witness element is the control block: 33 bytes
  plus 32 bytes for each Merkle path node, and Bitcoin Core accepts at most 128 path nodes, which
  limits a script tree to a depth of 128."
