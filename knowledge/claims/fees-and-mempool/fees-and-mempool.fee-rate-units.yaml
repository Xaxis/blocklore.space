id: fees-and-mempool.fee-rate-units
statement: Bitcoin fee rates are usually quoted in satoshis per virtual byte (sat/vB). BIP 141
  defines a transaction's virtual size as its weight divided by 4, rounded up, so the same fee rate
  costs a larger transaction more sats in total.
