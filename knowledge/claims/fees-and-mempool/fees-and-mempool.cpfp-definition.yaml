id: fees-and-mempool.cpfp-definition
statement: "Child pays for parent (CPFP) is a way to speed up a stuck, low fee rate Bitcoin
  transaction: someone who controls one of its outputs spends that output in a new child transaction
  with a high fee rate, which encourages miners to include both transactions in a block."
