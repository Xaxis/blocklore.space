id: fees-and-mempool.full-rbf-option-removed
statement: "Bitcoin Core 29.0 removed the -mempoolfullrbf option (Bitcoin Core PR #30592), making
  full replace-by-fee the standard behavior. Since then, Bitcoin Core's replacement rules no longer
  require a transaction to signal BIP 125 replaceability before it can be replaced."
