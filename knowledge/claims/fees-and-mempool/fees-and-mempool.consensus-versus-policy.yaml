id: fees-and-mempool.consensus-versus-policy
statement: Bitcoin Core's relay policy is a set of rules a node applies, in addition to consensus
  rules, to unconfirmed transactions before accepting them into its mempool. Policy is local to each
  node and configurable, and it is not applied to transactions in blocks, so a block can contain
  transactions a node would not have relayed.
