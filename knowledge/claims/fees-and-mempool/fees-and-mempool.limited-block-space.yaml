id: fees-and-mempool.limited-block-space
statement: "Bitcoin blocks have limited space: a consensus rule caps each block at 4,000,000 weight
  units. Because more transactions can be waiting than fit in the next block, users attach fees to
  compete for inclusion, and transactions paying higher fee rates are generally mined first."
