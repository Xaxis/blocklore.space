id: fees-and-mempool.rbf-feerate-diagram
statement: Since Bitcoin Core 31.0, a replacement is accepted only if the mempool's feerate diagram
  is strictly better afterward, a check performed by the function ImprovesFeerateDiagram, declared
  in src/policy/rbf.h. The release notes say this eliminates all known cases where replacements left
  the mempool worse off.
