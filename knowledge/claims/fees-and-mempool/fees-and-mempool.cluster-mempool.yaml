id: fees-and-mempool.cluster-mempool
statement: 'Bitcoin Core 31.0, published on 19 April 2026, reimplemented the mempool as a "cluster
  mempool": it groups connected unconfirmed transactions into clusters, by default at most 64
  transactions and 101 kvB each, and drops the earlier ancestor and descendant limits.'
