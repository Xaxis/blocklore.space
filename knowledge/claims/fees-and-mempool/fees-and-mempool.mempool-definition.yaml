id: fees-and-mempool.mempool-definition
statement: A mempool (short for memory pool) is the set of valid but unconfirmed transactions that a
  Bitcoin node holds while they wait to be mined. Each node keeps its own mempool under its own
  local rules, so there is no single network-wide mempool.
