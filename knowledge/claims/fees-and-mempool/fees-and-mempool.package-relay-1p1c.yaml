id: fees-and-mempool.package-relay-1p1c
statement: Since Bitcoin Core 28.0, a node that receives a transaction paying too low a fee rate for
  its mempool can pair it with a child transaction and evaluate both as a package (1-parent-1-child
  package relay), so a child can pay for a parent that would otherwise be rejected. The release
  notes call this feature limited and not yet reliable under adversarial conditions.
