id: fees-and-mempool.rbf-definition
statement: Replace-by-fee (RBF) is a node relay policy that lets an unconfirmed Bitcoin transaction
  be replaced by a different transaction spending at least one of the same inputs and paying a
  higher fee. A sender can use RBF to speed up a stuck transaction.
