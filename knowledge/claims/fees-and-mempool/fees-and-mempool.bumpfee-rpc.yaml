id: fees-and-mempool.bumpfee-rpc
statement: Bitcoin Core's wallet has a bumpfee command that replaces an unconfirmed wallet
  transaction with a new version paying a higher fee, taking the extra fee from change outputs or by
  adding inputs when necessary.
