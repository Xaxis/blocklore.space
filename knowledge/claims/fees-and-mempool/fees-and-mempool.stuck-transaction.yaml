id: fees-and-mempool.stuck-transaction
statement: A Bitcoin transaction can stay unconfirmed for a long time when its fee rate is low
  compared with other transactions waiting to be mined, because transactions paying higher fee rates
  are generally mined first. Since Bitcoin Core 31.0, its block templates select mempool
  transactions in order of the fee rate at which they are expected to be mined.
