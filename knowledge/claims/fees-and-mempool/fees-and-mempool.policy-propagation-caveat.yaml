id: fees-and-mempool.policy-propagation-caveat
statement: Because relay policy differs from node to node, a transaction one node accepts may not
  reach miners. The Bitcoin Core 30.0 release notes warn that transactions created with the newly
  allowed lower fee rates are not guaranteed to propagate or confirm unless the lower defaults are
  widely adopted across the network.
