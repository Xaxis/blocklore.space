id: fees-and-mempool.truc-rules
statement: "BIP 431 defines TRUC (Topologically Restricted Until Confirmation) transactions: a
  transaction with version 3 opts into rules that, while it is unconfirmed, allow at most one
  unconfirmed parent or child, cap its size at 10,000 vB, and cap a TRUC child of an unconfirmed
  TRUC parent at 1,000 vB."
kind: fact
