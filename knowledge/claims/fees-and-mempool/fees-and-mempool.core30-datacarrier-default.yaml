id: fees-and-mempool.core30-datacarrier-default
statement: Bitcoin Core 30.0, published on 10 October 2025, raised the default -datacarriersize to
  100,000 bytes, which its release notes say effectively uncaps OP_RETURN data because the maximum
  standard transaction size is reached first. Setting -datacarriersize=83 restores the earlier
  limit.
