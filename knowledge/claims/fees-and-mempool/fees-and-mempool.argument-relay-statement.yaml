id: fees-and-mempool.argument-relay-statement
statement: A statement titled "Bitcoin Core development and transaction relay policy", published on
  bitcoincore.org on 6 June 2025 and signed by a group of Bitcoin Core contributors, argued that
  knowingly refusing to relay transactions that miners would include in blocks anyway pushes users
  toward other channels to reach miners.
