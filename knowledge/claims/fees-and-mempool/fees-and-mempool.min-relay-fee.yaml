id: fees-and-mempool.min-relay-fee
statement: Since Bitcoin Core 30.0, published on 10 October 2025, the default minimum relay fee rate
  (-minrelaytxfee) and incremental relay fee rate (-incrementalrelayfee) are both 0.1 sat/vB, set in
  the code as 100 satoshis per 1,000 vB.
