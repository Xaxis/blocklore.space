id: fees-and-mempool.knots-reject-filters
statement: As of commit 5811235e on its 29.x-knots branch (checked 20 November 2026), Bitcoin Knots
  turns on by default two relay options, -rejectparasites and -rejecttokens, which its help text
  describes as refusing to relay or mine "parasitic overlay protocols" and "transactions involving
  non-bitcoin tokens".
