id: fees-and-mempool.mempool-expiry
statement: Bitcoin Core removes a transaction from its mempool if it is still unconfirmed 336 hours
  (14 days) after entering, by default. The limit is set by the -mempoolexpiry option, so other
  nodes may keep or drop the same transaction at different times.
