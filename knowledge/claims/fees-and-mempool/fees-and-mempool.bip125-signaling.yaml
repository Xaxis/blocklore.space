id: fees-and-mempool.bip125-signaling
statement: "BIP 125 specifies opt-in replace-by-fee: a transaction signals that it may be replaced
  if any of its inputs has an nSequence value below 0xfffffffe, and BIP 125 caps the transactions a
  replacement may evict, counting their descendants, at 100."
