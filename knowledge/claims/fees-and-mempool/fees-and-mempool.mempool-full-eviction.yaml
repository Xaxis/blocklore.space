id: fees-and-mempool.mempool-full-eviction
statement: Bitcoin Core limits its mempool to 300 MB of memory by default (the -maxmempool option).
  When the mempool is full, a node starts rejecting new transactions below a minimum fee rate
  threshold and evicts low fee rate transactions, so a low-fee transaction can drop out of some
  nodes' mempools.
