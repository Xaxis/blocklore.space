    title: Bitcoin Knots src/node/mempool_args.cpp (29.x-knots), -datacarriersize default
    url: https://github.com/bitcoinknots/bitcoin/blob/5811235e3f5da687de1ac8ca731331a2fc24a350/src/node/mempool_args.cpp
    locator: ApplyArgsManOptions, -datacarriersize
    quote: mempool_opts.max_datacarrier_bytes = argsman.GetIntArg("-datacarriersize",
      MAX_OP_RETURN_RELAY);
    accessed: 2026-11-20
