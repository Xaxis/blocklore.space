id: fees-and-mempool.knots-datacarrier-default
statement: As of commit 5811235e on its 29.x-knots branch (checked 20 November 2026), Bitcoin Knots
  uses 83 bytes as its default -datacarriersize, the same value that Bitcoin Core 30.0's release
  notes give for reverting to the limit Bitcoin Core enforced before version 30.0.
kind: fact
topics:
  - fees-and-mempool
depth: researcher
status: established
confidence: high
