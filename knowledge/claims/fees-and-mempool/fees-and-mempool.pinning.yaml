id: fees-and-mempool.pinning
statement: Transaction pinning is when an attacker exploits limits in mempool relay policy to stop
  an incentive-compatible transaction from being accepted or fee-bumped. BIP 431's TRUC rules (also
  called version 3 transaction relay) were designed to make pinning harder for contract protocols
  such as Lightning, where parties sign time-sensitive transactions to broadcast later.
