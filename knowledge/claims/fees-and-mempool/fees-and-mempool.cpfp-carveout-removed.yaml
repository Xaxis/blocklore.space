id: fees-and-mempool.cpfp-carveout-removed
statement: Bitcoin Core 31.0 removed the CPFP carve-out, which had let one extra small child join a
  package already at its descendant limit. The release notes say contract protocols needing similar
  behavior are expected to use TRUC transactions and sibling eviction instead.
