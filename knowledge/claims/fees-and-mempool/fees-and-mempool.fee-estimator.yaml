id: fees-and-mempool.fee-estimator
statement: CBlockPolicyEstimator, a fee estimator in Bitcoin Core's
  src/policy/fees/block_policy_estimator.h, estimates the fee rate a transaction needs to be
  confirmed within a target number of blocks by grouping observed transactions into buckets of
  similar fee rates and tracking how quickly each bucket confirms.
