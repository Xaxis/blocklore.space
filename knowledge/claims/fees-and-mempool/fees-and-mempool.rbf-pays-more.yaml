id: fees-and-mempool.rbf-pays-more
statement: "Under Bitcoin Core's replacement rules, a replacement transaction must pay at least the
  total absolute fee of the transactions it replaces, plus enough extra to pay for its own size at
  the incremental relay fee rate: at 0.1 sat/vB, a 500 vB replacement must add at least 50 sats."
