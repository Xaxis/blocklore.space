id: fees-and-mempool.fee-definition
statement: "A Bitcoin transaction's fee is not a separate field: it is the total value of the
  transaction's inputs minus the total value of its outputs. Bitcoin Core's consensus code computes
  the fee this way and rejects as invalid a transaction that spends inputs worth less than its
  outputs."
