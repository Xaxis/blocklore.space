id: fees-and-mempool.full-rbf-default
statement: "Bitcoin Core 28.0, published on 2 October 2024, changed the default of the
  -mempoolfullrbf option from 0 to 1 (Bitcoin Core PR #30493), so nodes running defaults accept
  replacements of unconfirmed transactions whether or not they signal BIP 125 replaceability."
