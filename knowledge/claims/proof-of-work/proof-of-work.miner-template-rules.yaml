id: proof-of-work.miner-template-rules
statement: "At commit f498a5a6, Bitcoin Core's GetMinimumTime raises the minimum block template
  timestamp on all networks to respect both the BIP 94 600-second timewarp limit and the BIP 54 rule
  that a period's last block is not earlier than its first; the BIP 54 part came from Bitcoin Core
  PR #35949, merged 7 September 2026."
