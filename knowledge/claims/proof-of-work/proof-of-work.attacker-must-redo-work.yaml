id: proof-of-work.attacker-must-redo-work
statement: "Each block mined on top of a Bitcoin transaction adds work that anyone trying to reverse
  it must redo: the Bitcoin whitepaper says an attacker would have to redo the proof of work of that
  block and every later block, then overtake the honest chain."
