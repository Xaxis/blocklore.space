id: proof-of-work.block-times-vary
statement: A 2018 statistical study of Bitcoin block arrival data (arXiv:1801.07447) reported that
  block arrivals do not follow the homogeneous Poisson process it says the original Bitcoin paper
  suggested, and proposed a refined model covering both periods of constant difficulty and how
  difficulty changes over time.
