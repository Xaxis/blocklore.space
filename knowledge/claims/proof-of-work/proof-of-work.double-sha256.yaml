id: proof-of-work.double-sha256
statement: "A Bitcoin block's hash is the double SHA-256 (SHA-256 applied twice) of its serialized
  header: Bitcoin Core's CBlockHeader::GetHash writes the header into a HashWriter, whose GetHash
  computes double SHA-256."
