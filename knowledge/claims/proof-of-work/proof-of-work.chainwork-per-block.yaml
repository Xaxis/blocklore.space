id: proof-of-work.chainwork-per-block
statement: Bitcoin Core counts each block's work as 2 to the power 256 divided by (target plus 1),
  the expected number of hashes needed to meet that target, and sums these values along a chain into
  nChainWork, the chainwork figure that decides which chain is best.
