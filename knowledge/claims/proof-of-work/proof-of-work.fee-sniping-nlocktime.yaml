id: proof-of-work.fee-sniping-nlocktime
statement: As of commit 0e8f70a8, Bitcoin Core's wallet by default discourages fee sniping, when its
  chain tip is recent, by setting a new transaction's nLockTime to the tip's block height, so only
  the next block can include it, and in 1 case out of 10 moves the locktime back by a random amount
  of up to 99 blocks.
