id: proof-of-work.nbits-compact
statement: "A Bitcoin header's 4-byte nBits field encodes the 256-bit target in a compact
  floating-point-like form: the top byte is an exponent in base 256 and the lower 23 bits are the
  mantissa, so the target equals mantissa times 256 to the power of (exponent minus 3)."
