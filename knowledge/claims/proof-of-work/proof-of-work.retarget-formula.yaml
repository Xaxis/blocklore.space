id: proof-of-work.retarget-formula
statement: At each mainnet retarget, Bitcoin Core's CalculateNextWorkRequired multiplies the
  previous target by the period's measured timespan, first limited to between one quarter and four
  times two weeks, divides by the two-week target timespan, and caps the result at the proof-of-work
  limit, so faster periods make the target smaller and mining harder.
