id: proof-of-work.equal-work-tie-break
statement: When two Bitcoin chain tips have equal total work, Bitcoin Core (as of commit 0e8f70a8)
  prefers the tip with the lower nSequenceId, which its code comment calls the earliest activatable
  time, rather than choosing at random.
