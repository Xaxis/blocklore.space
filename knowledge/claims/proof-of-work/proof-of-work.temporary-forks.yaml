id: proof-of-work.temporary-forks
statement: Two Bitcoin miners can find competing blocks at about the same time, so for a while
  different nodes work on different tips; the Bitcoin whitepaper says the tie is broken when the
  next block is found and one branch becomes longer, and nodes on the other branch then switch to
  it.
kind: mechanism
