id: proof-of-work.clamp-factor-four
statement: "Bitcoin limits each difficulty adjustment to a factor of four: Bitcoin Core clamps the
  measured timespan of a 2,016-block period to between one quarter and four times the two-week
  target before retargeting, so one retarget can at most quadruple or quarter the target."
