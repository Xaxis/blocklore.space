id: proof-of-work.selfish-mining-threshold
statement: The 2013 selfish mining paper by Ittay Eyal and Emin Gun Sirer proposes a modification to
  Bitcoin that it says protects against selfish mining pools controlling less than one quarter of
  mining resources, a threshold the paper contrasts with a "wrongly assumed" one-half bound.
