id: proof-of-work.selfish-mining-optimal-strategies
statement: The paper "Optimal Selfish Mining Strategies in Bitcoin" by Ayelet Sapirshtein, Yonatan
  Sompolinsky and Aviv Zohar (arXiv:1507.06183, July 2015) extends the selfish mining analysis and
  gives lower bounds on the computational power a Bitcoin miner needs to benefit from selfish
  mining.
