id: proof-of-work.bip326-nsequence
statement: BIP 326, an Informational BIP with status Draft as of 26 November 2026, recommends that
  wallets discourage fee sniping in taproot transactions by setting either nLockTime or nSequence,
  choosing each with 50 percent probability, so that such wallets give off-chain protocols a larger
  anonymity set.
