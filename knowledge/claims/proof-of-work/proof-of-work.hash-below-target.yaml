id: proof-of-work.hash-below-target
statement: Bitcoin Core's proof-of-work check in src/pow.cpp rejects a block header if the target
  decoded from its nBits is zero, negative, overflowing or above the network's proof-of-work limit,
  or if the header hash, read as a 256-bit number, is greater than that target.
