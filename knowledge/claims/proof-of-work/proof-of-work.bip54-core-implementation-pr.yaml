id: proof-of-work.bip54-core-implementation-pr
statement: 'As of 20 November 2026, Bitcoin Core PR #35793, "Implement BIP 54 (Consensus Cleanup)
  without mainnet activation", is open and not merged; its description says the BIP 54 validation
  rules it implements are only enabled on regtest, with mainnet activation, if any, to be considered
  separately.'
