id: proof-of-work.stratum-v2-transaction-selection
statement: Bitcoin Optech describes Stratum v2 as a pool mining protocol that can let individual
  pool members choose which transactions go into their blocks, whereas under Stratum v1 as typically
  used the pool sets the transactions and may reject a member's attempt to change them.
