id: proof-of-work.header-80-bytes
statement: "A Bitcoin block header is 80 bytes: Bitcoin Core serializes six fields, nVersion (4
  bytes), hashPrevBlock (32 bytes), hashMerkleRoot (32 bytes), nTime (4 bytes), nBits (4 bytes) and
  nNonce (4 bytes), and proof of work is computed over these 80 bytes only."
kind: fact
