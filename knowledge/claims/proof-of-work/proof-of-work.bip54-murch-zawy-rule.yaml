id: proof-of-work.bip54-murch-zawy-rule
statement: BIP 54 proposes that the last block of each 2,016-block difficulty period (height N with
  N modulo 2,016 equal to 2,015) must have a timestamp no earlier than that of the block at height N
  minus 2,015, the period's first block, so a period's measured duration cannot be negative.
