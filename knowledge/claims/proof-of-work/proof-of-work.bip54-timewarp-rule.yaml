id: proof-of-work.bip54-timewarp-rule
statement: BIP 54 proposes that the first block of each 2,016-block difficulty period (height
  divisible by 2,016) must have a timestamp no earlier than 7,200 seconds (two hours) before the
  timestamp of the block immediately preceding it, which the BIP gives as its fix for the timewarp
  attack.
kind: fact
