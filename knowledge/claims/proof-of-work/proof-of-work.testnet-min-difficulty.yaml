id: proof-of-work.testnet-min-difficulty
statement: On networks where fPowAllowMinDifficultyBlocks is true (testnet3, testnet4 and regtest as
  of commit 0e8f70a8), Bitcoin Core requires a block that is not at a difficulty adjustment height
  to use minimum difficulty when its timestamp is more than twice the 600-second target spacing (20
  minutes) after the previous block; mainnet sets the flag to false.
