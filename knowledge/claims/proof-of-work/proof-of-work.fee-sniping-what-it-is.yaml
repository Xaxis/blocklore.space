id: proof-of-work.fee-sniping-what-it-is
statement: Fee sniping is a miner deliberately re-mining one or more recent Bitcoin blocks to take
  the fees paid in them, replacing the blocks other miners found; BIP 326 calls it a hypothetical
  outcome of bad mining incentives in a future when new coin issuance is low.
