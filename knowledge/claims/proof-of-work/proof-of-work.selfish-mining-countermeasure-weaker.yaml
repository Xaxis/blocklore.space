id: proof-of-work.selfish-mining-countermeasure-weaker
statement: The 2015 paper by Ayelet Sapirshtein, Yonatan Sompolinsky and Aviv Zohar reports that the
  countermeasure to selfish mining suggested by Ittay Eyal and Emin Gun Sirer is slightly less
  effective than previously conjectured.
