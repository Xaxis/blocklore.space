id: proof-of-work.most-work-chain
statement: "Bitcoin nodes follow the valid chain with the most accumulated proof of work, not the
  chain with the most blocks: Bitcoin Core ranks candidate chain tips first by total chain work, so
  a shorter chain of harder blocks can outrank a longer chain of easier ones."
