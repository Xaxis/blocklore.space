id: proof-of-work.bip94-testnet4
statement: "BIP 94 (Testnet 4) adds a timewarp rule: the first block of each difficulty period must
  not be timestamped more than 600 seconds before the previous block. Bitcoin Core enforces this
  rule only on testnet4 and regtest; its mainnet parameters set enforce_BIP94 to false."
