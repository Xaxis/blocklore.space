id: proof-of-work.permitted-difficulty-transition
statement: "Bitcoin Core's PermittedDifficultyTransition, in src/pow.cpp, checks a header's nBits
  against only the previous block's: at a difficulty adjustment height the new target must lie
  within a factor of 4 of the old one, at any other height it must be unchanged, and on networks
  allowing minimum-difficulty blocks it always passes."
