id: proof-of-work.timewarp-attack
statement: BIP 54 (Consensus Cleanup) states that the timewarp bug lets an attacker with a majority
  of Bitcoin's hashrate arbitrarily lower mining difficulty by manipulating block timestamps, and
  that in the worst case the attacker can bring difficulty to its minimum within 38 days.
