id: proof-of-work.minimum-chain-work
statement: Bitcoin Core's mainnet parameters set nMinimumChainWork, a minimum total chain work
  documented in the code with the comment that the best chain should have at least this much work;
  at commit f498a5a6 its mainnet value is 0x145ec036acc5ba740052af1a0.
