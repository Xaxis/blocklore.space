id: proof-of-work.retarget-interval
statement: "Bitcoin mainnet recalculates its proof-of-work target every 2,016 blocks: Bitcoin Core
  derives this interval as the target timespan of two weeks (1,209,600 seconds) divided by the
  target block spacing of 600 seconds."
kind: mechanism
