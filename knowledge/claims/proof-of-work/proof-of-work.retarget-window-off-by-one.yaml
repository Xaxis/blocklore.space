id: proof-of-work.retarget-window-off-by-one
statement: Bitcoin Core measures each 2,016-block difficulty period from the timestamp of its own
  first block to that of its last block, which spans 2,015 block intervals rather than 2,016, so
  consecutive measurement windows do not overlap. This off-by-one is the property the timewarp
  attack exploits.
