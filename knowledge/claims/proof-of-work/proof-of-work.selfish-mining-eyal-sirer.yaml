id: proof-of-work.selfish-mining-eyal-sirer
statement: Selfish mining, described by Ittay Eyal and Emin Gun Sirer in their 2013 paper "Majority
  is not Enough", is a strategy in which a pool keeps the blocks it finds private and reveals them
  only as the public chain catches up, which the paper says earns colluding miners more than their
  fair share of revenue.
