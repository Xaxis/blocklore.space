id: proof-of-work.selfish-mining-random-tiebreak
statement: The defense against selfish mining that Ittay Eyal and Emin Gun Sirer proposed in 2013 is
  that a miner who learns of competing branches of the same length propagates all of them and picks
  one to mine on uniformly at random, instead of mining only on the first branch it received.
