id: proof-of-work.getblocktemplate-audit
statement: The getblocktemplate protocol (BIP 22 and BIP 23, both Deployed as of 26 November 2026)
  sends miners the entire block structure rather than a bare header to hash, so a miner in a pool
  can audit and optionally modify the block, which BIP 23 gives as its response to concerns about
  pool centralization.
kind: mechanism
