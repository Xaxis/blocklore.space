id: covenants.txhash-what-it-does
statement: BIP 346 (status Draft as of 20 November 2026) specifies OP_TXHASH, a redefinition of
  tapscript opcode OP_SUCCESS189 (0xbd) that pushes a 32-byte hash of the fields of the spending
  transaction chosen by a TxFieldSelector argument.
