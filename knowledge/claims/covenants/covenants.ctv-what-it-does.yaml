id: covenants.ctv-what-it-does
statement: BIP 119 (status Draft as of 20 November 2026) specifies OP_CHECKTEMPLATEVERIFY (CTV), a
  redefinition of OP_NOP4. When the top stack element is 32 bytes, the script fails unless it equals
  a hash of the spending transaction's version, locktime, input and output counts, sequences,
  outputs, input index and, when present, scriptSigs; other sizes are treated as a NOP.
