id: covenants.apo-what-it-does
statement: "BIP 118 (status Draft as of 20 November 2026) specifies SIGHASH_ANYPREVOUT (0x40) and
  SIGHASH_ANYPREVOUTANYSCRIPT (0xc0) for a new tapscript public key type: a signature made with them
  does not commit to the identifier of the output being spent, so it can be reused with another
  output that has a compatible script."
