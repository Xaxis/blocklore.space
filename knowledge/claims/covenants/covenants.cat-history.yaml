id: covenants.cat-history
statement: OP_CAT, an opcode that joins two pieces of data, was part of Bitcoin's original script
  language and was disabled in 2010. Variations on it are frequently proposed for re-addition by
  soft fork, including BIP 347, which would add it to tapscript.
kind: fact
