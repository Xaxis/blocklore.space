id: covenants.argument-prefer-txhash
statement: Matt Corallo, replying to the CTV and CSFS letter on 9 June 2025, wrote of having yet to
  see a reasoned explanation of why OP_CHECKTEMPLATEVERIFY should be preferred over TXHASH, and
  argued that choosing something worse to avoid choosing an encoding for something better is not
  good engineering.
