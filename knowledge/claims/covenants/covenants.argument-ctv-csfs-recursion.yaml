id: covenants.argument-ctv-csfs-recursion
statement: Anthony Towns posted on 5 March 2025 a construction showing that OP_CHECKTEMPLATEVERIFY
  combined with OP_CHECKSIGFROMSTACK can build a "recursive covenant" in the sense BIP 119 uses,
  writing that he did not believe it poses problems in practice. In a reply posted on 7 March 2025
  (UTC) he argued that if some uses considered scary remain prevented even with both opcodes, BIP
  119 should document them.
