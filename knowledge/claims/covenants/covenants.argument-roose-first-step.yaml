id: covenants.argument-roose-first-step
statement: Steven Roose, opening a Delving Bitcoin thread on 10 March 2025, argued for
  OP_CHECKTEMPLATEVERIFY plus OP_CHECKSIGFROMSTACK as a minimal first step towards covenants, saying
  both opcodes stay useful even if Bitcoin later moves towards generalized covenants.
