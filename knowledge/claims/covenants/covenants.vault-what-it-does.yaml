id: covenants.vault-what-it-does
statement: BIP 345 (status Closed as of 20 November 2026) proposed OP_VAULT and OP_VAULT_RECOVER,
  tapscript opcodes that, used with OP_CHECKTEMPLATEVERIFY, enforce a delay before coins can be
  spent to an arbitrary destination, while letting them be sent to a pre-set recovery path at any
  time before the final withdrawal.
