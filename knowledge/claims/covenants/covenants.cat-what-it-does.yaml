id: covenants.cat-what-it-does
statement: "BIP 347 (status Complete as of 20 November 2026) specifies OP_CAT in tapscript by
  redefining OP_SUCCESS126 (0x7e): the opcode concatenates the top two stack elements and fails if
  the result would exceed the 520-byte maximum script element size."
