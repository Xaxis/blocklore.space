id: covenants.csfs-what-it-does
statement: BIP 348 (status Draft as of 20 November 2026) specifies OP_CHECKSIGFROMSTACK (CSFS), a
  tapscript opcode replacing OP_SUCCESS204 that takes a public key, a message and a signature from
  the stack and, for a 32-byte public key and a non-empty signature, verifies the signature over
  that arbitrary message under BIP 340.
