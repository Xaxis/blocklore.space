id: lightning.watchtowers
statement: A Lightning watchtower is a service that monitors the Bitcoin blockchain on a user's
  behalf and broadcasts a penalty transaction if a channel peer publishes an outdated channel state,
  so the user can go offline for significant amounts of time.
