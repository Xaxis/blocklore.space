id: lightning.watch-the-chain
statement: A self-custodial Lightning node must have the Bitcoin blockchain watched, by itself or
  through a watchtower, for transactions that spend its channels, so it can respond with a penalty
  transaction if a peer broadcasts an old channel state. A node that is offline during such an
  attempt, with no watchtower, can lose funds.
