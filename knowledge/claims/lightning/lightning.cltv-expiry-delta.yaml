id: lightning.cltv-expiry-delta
statement: A forwarding Lightning node's cltv_expiry_delta is the number of blocks it subtracts from
  an incoming HTLC's timeout when it forwards the payment. BOLT 2 derives a worst case of 3R+2G+2S
  blocks, where R is a reorganization depth, G a grace period and S the blocks a transaction may
  take to confirm, and says that if in doubt a delta of at least 34 blocks is reasonable.
