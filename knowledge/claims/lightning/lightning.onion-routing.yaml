id: lightning.onion-routing
statement: Lightning payments are routed with onion encryption based on the Sphinx construction,
  specified in BOLT 4. The onion packet's hop payloads are a fixed 1,300 bytes, and an intermediate
  node cannot learn which other nodes, besides its predecessor and successor, are on the route.
