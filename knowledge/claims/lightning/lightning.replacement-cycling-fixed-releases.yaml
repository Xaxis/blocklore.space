id: lightning.replacement-cycling-fixed-releases
statement: 'The October 2023 replacement cycling disclosure lists, for each Lightning
  implementation, one CVE and the release in which its mitigations "should be present": LDK 0.0.118
  (CVE-2023-40231), Eclair 0.9.0 (CVE-2023-40232), LND 0.17.0-beta (CVE-2023-40233) and Core
  Lightning 23.08.01 (CVE-2023-40234).'
