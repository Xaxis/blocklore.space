id: lightning.jamming-open-problem
statement: Which defense against Lightning channel jamming, if any, will the BOLTs specify? As of 20
  November 2026 this is unresolved. Optech records proposals from 2019 to 2026, including upfront
  fees and local reputation, and reported LND's experimental reputation scoring in October 2026. A
  merged BOLTs change would settle it.
