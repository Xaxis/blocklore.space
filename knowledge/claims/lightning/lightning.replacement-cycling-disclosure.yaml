id: lightning.replacement-cycling-disclosure
statement: Antoine Riard publicly disclosed replacement cycling attacks against Lightning HTLCs on
  the bitcoin-dev mailing list on 16 October 2023, as CVE-2023-40231 to CVE-2023-40234, after
  mitigations had been deployed. The post said no such attacks had been observed or reported in the
  wild in roughly the previous 10 months.
