id: lightning.jamming-eclair-lowest-capacity
statement: "Eclair PR #1539, merged on 2 October 2020, made an Eclair node with several channels to
  the same peer forward a payment through the one with the least remaining value. The PR describes
  this as making it harder for attackers to occupy high-capacity channels; Optech noted it does not
  eliminate channel jamming."
