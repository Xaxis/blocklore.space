id: lightning.replacement-cycling-forwarding-only
statement: The replacement cycling vulnerability disclosed in October 2023, an attack that keeps a
  Lightning node's time-sensitive transaction out of blocks, affects only nodes that forward
  payments for others. Bitcoin Optech reported that users who only send and receive their own
  payments are not affected.
