id: lightning.replacement-cycling
statement: "Replacement cycling is an attack on unconfirmed transactions that depend on CPFP fee
  bumps, mainly multiparty ones such as those of Lightning channels: the attacker uses mempool
  transaction replacement to remove a victim's transaction from relaying nodes' mempools without
  leaving an alternative transaction in its place."
