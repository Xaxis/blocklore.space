id: lightning.splicing
statement: Splicing, specified in BOLT 2, replaces a Lightning channel's funding transaction with a
  new one, which lets the peers add funds to or remove funds from an open channel without closing
  it. BOLT 9 assigns it the option_splice feature bits 62/63.
