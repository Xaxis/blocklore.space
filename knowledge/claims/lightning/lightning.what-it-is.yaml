id: lightning.what-it-is
statement: The Lightning Network is a protocol for fast bitcoin payments over a network of payment
  channels between pairs of nodes. Payments move off-chain, and Bitcoin transactions are used to
  open channels and to enforce their balances when the parties do not cooperate.
