id: lightning.funding-output
statement: A Lightning channel opens with an on-chain funding transaction whose channel output, in
  BOLT 3, pays to a 2-of-2 multisignature script built from the two peers' funding public keys,
  ordered lexicographically, so it can only be spent with both peers' signatures.
