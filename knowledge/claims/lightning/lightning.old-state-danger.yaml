id: lightning.old-state-danger
statement: Restoring a Lightning node from a copy of its channel database is risky, because the copy
  may not hold the latest channel state. Broadcasting an old, revoked commitment transaction lets
  the channel peer claim all of that commitment's outputs with a penalty transaction.
