id: lightning.jamming-eclair-max-cltv
statement: "Since Eclair PR #3323, merged on 8 July 2026, Eclair fails incoming HTLCs whose CLTV
  expiry is more than 2,016 blocks (about two weeks) in the future, as it already did for outgoing
  ones, which limits how long a payment can lock funds and makes slow channel jamming harder."
