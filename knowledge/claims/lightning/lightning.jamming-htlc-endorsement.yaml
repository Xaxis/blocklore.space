id: lightning.jamming-htlc-endorsement
statement: "HTLC endorsement is a local reputation system proposed against Lightning channel
  jamming. BLIPs PR #27, merged on 8 August 2024, added BLIP 4, an experimental signaling protocol
  that carries the endorsement signal in the update_add_htlc message as TLV type 65555."
