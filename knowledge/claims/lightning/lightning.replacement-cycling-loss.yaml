id: lightning.replacement-cycling-loss
statement: Bitcoin Optech's October 2023 description of a successful replacement cycling attack
  against a forwarded Lightning payment concludes that, for a forwarded amount x and not counting
  fees, the attacker's upstream side pays nothing, its downstream side receives x, and the
  forwarding node loses x.
