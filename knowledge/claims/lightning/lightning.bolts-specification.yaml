id: lightning.bolts-specification
statement: The Lightning protocol is specified in the BOLT documents of the lightning/bolts
  repository, a set of numbered files including BOLT 2 (peer protocol), BOLT 3 (transactions), BOLT
  4 (onion routing), BOLT 7 (gossip), BOLT 11 (invoices) and BOLT 12 (offers), as of 20 November
  2026.
