id: lightning.software-bugs
statement: "Bugs in Lightning node software are a recorded risk: as of 26 November 2026, Bitcoin
  Optech's responsible disclosures topic lists disclosed vulnerabilities in LND, Core Lightning,
  Eclair and LDK, ranging from denial-of-service bugs that exhaust a node's memory to bugs that
  allowed theft of channel funds."
