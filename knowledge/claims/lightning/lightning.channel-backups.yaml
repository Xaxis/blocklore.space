id: lightning.channel-backups
statement: In LND, the wallet seed alone recovers only on-chain funds. Recovering funds held in open
  channels also needs a Static Channel Backup (SCB), which lets the node reconnect to its peers and
  use the protocol's Data Loss Protection feature so the peers close those channels.
