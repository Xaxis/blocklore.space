id: lightning.anchor-outputs
statement: In BOLT 3's anchor commitment format (feature option_anchors, bits 22/23 in BOLT 9), each
  anchor output on a Lightning commitment transaction is fixed at 330 sats, which BOLT 3 gives as
  the default dust limit for P2WSH outputs.
