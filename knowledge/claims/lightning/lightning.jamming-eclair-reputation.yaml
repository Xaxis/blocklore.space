id: lightning.jamming-eclair-reputation
statement: "Eclair PR #2716, reported in Bitcoin Optech Newsletter #363 on 18 July 2025, implements
  a local per-peer reputation system for HTLC endorsement based on routing fees. Optech reported
  that the PR mainly collects data for channel jamming research and does not yet implement
  penalties."
