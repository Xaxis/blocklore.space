id: lightning.lnd-security-support
statement: LND's security policy (SECURITY.md at commit 8cdbf85c) says both maintained LND release
  lines receive security fixes, while an end-of-life line receives no further releases, including
  security fixes. It recommends running the latest minor release of the most recent major line a
  node can upgrade to.
