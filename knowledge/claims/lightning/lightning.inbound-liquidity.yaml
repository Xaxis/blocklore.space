id: lightning.inbound-liquidity
statement: "To receive over Lightning, a node needs inbound liquidity: funds on the peer's side of
  its channels. A channel the node opens and funds by itself typically starts with the balance on
  the node's own side, so the node can send through that channel before it can receive."
