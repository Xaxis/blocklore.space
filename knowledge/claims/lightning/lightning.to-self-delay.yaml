id: lightning.to-self-delay
statement: In BOLT 3, the outputs of a Lightning commitment transaction that return funds to the
  peer who broadcast it are delayed by to_self_delay blocks, a value the other peer sets in BOLT 2,
  giving that other peer time to spot a revoked commitment and claim the funds.
