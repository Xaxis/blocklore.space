id: lightning.jamming-lnd-local-reputation
statement: "LND PR #10919, merged on 16 October 2026, adds a local reputation subsystem aimed at
  channel jamming that, in this first step, only records and logs reputation: a rejection for
  insufficient reputation is a no-op, so HTLC forwarding is not changed."
