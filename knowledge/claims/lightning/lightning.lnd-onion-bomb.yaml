id: lightning.lnd-onion-bomb
statement: LND versions before 0.17.0-beta could be crashed by a crafted onion packet that made the
  node allocate memory until it ran out (CVE-2024-38359, publicly disclosed in June 2024). The fix
  in 0.17.0-beta caps that allocation, and upgrading to 0.17.0 or later is the defense the
  disclosure gives.
