id: lightning.replacement-cycling-lnd-sweeper
statement: In a Delving Bitcoin post of 11 March 2025, Matt Morehouse wrote that LND's
  deadline-aware sweeper, which by default pays up to 50% of an HTLC's value in fees, means an
  attacker must generally spend at least 20 times the HTLC's value to succeed with replacement
  cycling.
