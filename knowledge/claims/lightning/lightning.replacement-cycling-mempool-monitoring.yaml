id: lightning.replacement-cycling-mempool-monitoring
statement: "As a defense against replacement cycling, Eclair and LND scan their local mempool when
  forwarding payments, as of the October 2023 disclosure: if they see the attacker's unconfirmed
  preimage transaction before it is replaced, they extract the payment preimage and use it to claim
  the incoming payment."
