id: lightning.htlc-slot-limit
statement: "BOLT 2 lets a Lightning node accept at most 483 pending payments (HTLCs) from its
  channel peer, or 114 on zero_fee_commitments channels. Optech's channel jamming topic describes
  how the 483 limit enables HTLC jamming: an attacker sends 483 small payments and leaves them
  unsettled, filling the slots while locking little value."
