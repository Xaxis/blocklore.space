id: lightning.replacement-cycling-cltv-delta
statement: A longer CLTV expiry delta makes replacement cycling against a forwarding Lightning node
  harder and costlier, by giving the node more blocks in which to rebroadcast. The October 2023
  disclosure gave the default deltas then as Eclair 144 blocks, Core Lightning 34, LND 80 and LDK
  72.
