id: lightning.offers
statement: BOLT 12 offers are longer-lived Lightning payment requests, encoded with the prefix
  "lno", from which a payer requests a fresh invoice over the Lightning Network itself. BOLT 12 uses
  blinded paths in place of BOLT 11's payment_secret and payment_metadata.
