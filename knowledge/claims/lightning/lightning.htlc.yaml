id: lightning.htlc
statement: "A Hashed Time Locked Contract (HTLC) is a conditional Lightning payment between two
  peers, carried as an output of the commitment transaction: the recipient claims it with a
  signature and the payment preimage, or else the payer reclaims it after a set time."
