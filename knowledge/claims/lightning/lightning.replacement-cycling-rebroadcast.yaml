id: lightning.replacement-cycling-rebroadcast
statement: "One defense against replacement cycling is aggressive rebroadcasting: as of the October
  2023 disclosure, Core Lightning, Eclair, LDK and LND rebroadcast their time-sensitive transactions
  several times before the next block, which raises the fees an attacker must pay to keep evicting
  them."
