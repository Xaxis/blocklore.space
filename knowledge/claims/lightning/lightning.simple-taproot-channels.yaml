id: lightning.simple-taproot-channels
statement: As of 20 November 2026, the lightning/bolts repository holds an extension document,
  "Simple Taproot Channels", created 20 April 2022, in which the channel's multisignature funding
  output becomes a single P2TR key formed with MuSig2 key aggregation. It is outside the numbered
  BOLTs.
