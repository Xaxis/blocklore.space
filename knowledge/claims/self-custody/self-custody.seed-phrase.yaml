id: self-custody.seed-phrase
statement: A seed phrase (also called a recovery phrase or mnemonic), as specified in BIP 39, is a
  list of 12, 15, 18, 21 or 24 words, each taken from a fixed list of 2,048 words, that encodes 128
  to 256 bits of random data from which a wallet derives its keys.
