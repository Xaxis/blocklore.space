id: self-custody.bip39-seed-derivation
statement: BIP 39 turns a mnemonic into a binary seed with PBKDF2, using HMAC-SHA512 and 2,048
  iterations, with the string "mnemonic" plus the passphrase as the salt. With no passphrase, the
  empty string is used, so a passphrase changes the resulting seed itself rather than acting as a
  lock on a device.
