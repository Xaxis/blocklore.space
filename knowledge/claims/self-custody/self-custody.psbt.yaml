id: self-custody.psbt
statement: BIP 174 specifies the Partially Signed Bitcoin Transaction (PSBT) format, which carries
  everything a signer needs and collects signatures until an input is complete. It divides the work
  into roles (Creator, Updater, Signer, Combiner, Input Finalizer, Transaction Extractor) that one
  or several programs can fill.
