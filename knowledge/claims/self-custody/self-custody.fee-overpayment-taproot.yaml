id: self-custody.fee-overpayment-taproot
statement: "BIP 341 (taproot) defends taproot inputs against the fee overpayment attack: unless the
  SIGHASH_ANYONECANPAY flag is set, its signature message commits to the amounts of all transaction
  inputs, which BIP 341 says eliminates the possibility to lie to offline signing devices about a
  transaction's fee. Optech wrote in June 2020 that this should make it safer for hardware wallets
  to sign taproot inputs without evaluating previous transactions."
