id: self-custody.passphrase-tradeoff
statement: "A BIP 39 passphrase addresses the threat of someone finding the seed phrase backup, who
  then cannot spend without the passphrase too. Its cost is a second secret to keep: a lost
  passphrase, or one recorded with an error, loses access to the funds permanently, with no recovery
  mechanism."
