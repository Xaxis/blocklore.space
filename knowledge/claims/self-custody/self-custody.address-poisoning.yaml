id: self-custody.address-poisoning
statement: Address poisoning is a scam in which an attacker generates an address that looks like one
  the victim has used, especially at its beginning and end, and places it in the victim's
  transaction history, so that the victim later copies it and sends funds to the look-alike address
  by mistake.
