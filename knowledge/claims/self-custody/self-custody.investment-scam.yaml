id: self-custody.investment-scam
statement: Relationship investment scams, including romance scams, often begin with contact online,
  on social media or by text. After gaining the target's trust, the scammer steers them into an
  investment and shows fake trading gains, and the target may be sending money directly to the
  scammer's crypto wallets, where US regulators warn it is likely lost for good.
