id: self-custody.fee-overpayment
statement: The fee overpayment attack on multi-input segwit transactions uses compromised wallet
  software to get a signing device to sign two versions of a transaction, leading to a significantly
  overpaid fee, because under BIP 143 the amounts of other segwit inputs can be changed without
  affecting a signature. BIP 174 notes that many wallets defend against it by requiring the full
  previous transaction, as Trezor's firmware began doing in 2020.
