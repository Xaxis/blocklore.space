id: self-custody.what-it-is
statement: Self-custody of bitcoin is the practice of managing and storing it without relying on a
  third-party service, with the private keys or recovery phrase in the owner's full control. With a
  custodial wallet, the wallet's makers are technically in control of their users' funds.
