id: self-custody.musig-descriptor
statement: "BIP 390, a Draft as of bips commit 9f3d3bc, specifies a musig() descriptor key
  expression that combines several keys into one aggregate public key using MuSig2 (BIP 327), usable
  only inside tr(), rawtr() or sp() expressions. MuSig2 is n-of-n, not a threshold scheme: signing
  requires every signer involved in key aggregation."
kind: trace
