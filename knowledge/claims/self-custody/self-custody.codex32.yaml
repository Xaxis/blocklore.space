id: self-custody.codex32
statement: "BIP 93 (codex32), a Draft as of bips commit 9f3d3bc, specifies checksummed BIP 32 seeds
  that work with Shamir's secret sharing: a threshold of 2 to 9 shares recovers the secret, and
  fewer shares than the threshold leak no information about it. Its design lets checksums, splitting
  and recovery be done entirely with pen and paper."
