id: self-custody.multisig-costs
statement: "A multisig setup's cost is more to keep safe: the Bitcoin Design Guide says it increases
  complexity and requires keeping more keys securely stored or backed up, and Bitcoin Core's
  descriptor documentation notes that in its multisig example each participant must maintain and
  back up two separate wallets, a signer and the corresponding multisig."
