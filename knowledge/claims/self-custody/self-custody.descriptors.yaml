id: self-custody.descriptors
statement: Output script descriptors, specified in BIP 380, are a language for describing
  collections of output scripts, such as all addresses of an HD wallet. BIP 380 introduces them
  because a backup of private keys alone does not tell a restored wallet which kinds of output
  scripts to look for.
