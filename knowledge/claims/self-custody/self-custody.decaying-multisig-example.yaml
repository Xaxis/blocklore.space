id: self-custody.decaying-multisig-example
statement: Bitcoin Core's descriptor documentation, as of commit dd96035, includes a Miniscript
  multisig example that starts as 4-of-4 and decays to 3-of-4, 2-of-4 and finally 1-of-4 at blocks
  840,000, 1,050,000 and 1,260,000, which the document calls future halving heights. In a decaying
  multisig, the number of keys required to move the funds decreases over time.
