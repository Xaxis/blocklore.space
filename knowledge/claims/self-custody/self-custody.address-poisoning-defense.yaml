id: self-custody.address-poisoning-defense
statement: "Defenses against address poisoning stop relying on an address's ends or on recent
  history: a 2025 guide to bitcoin address poisoning advises checking the entire address before
  sending and using wallet labels or contacts, and a measurement study of the attack suggests
  wallets show more of the address and users keep allow-lists of trusted addresses."
