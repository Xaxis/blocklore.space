id: self-custody.multisig
statement: "A multisignature (multisig) wallet is controlled by more than one key and is described
  as m-of-n: a 2-of-3 setup needs two of its three private keys to sign a valid transaction. When a
  setup needs more than one signature, moving funds takes more than one key, which the Bitcoin
  Design Guide presents as a counter to the all-or-nothing risk of a single key."
