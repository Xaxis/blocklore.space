id: self-custody.psbt-v2
statement: "BIP 370 specifies PSBT version 2, which drops the global unsigned transaction and lets
  inputs and outputs be added after the PSBT is created. Bitcoin Core PR #21283, reported in Optech
  Newsletter #404 on 8 May 2026, added PSBTv2 support while keeping compatibility with version 0."
