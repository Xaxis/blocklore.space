id: self-custody.investment-scam-tells
statement: "US consumer and investor protection bodies list the tells of crypto investment scams:
  the FTC says only scammers guarantee profits or big returns or demand payment in cryptocurrency,
  and a joint investor alert from the SEC, CFTC, FINRA and NASAA calls promises of high returns with
  little or no risk classic warning signs of fraud, advising against investing on the advice of
  anyone who makes unsolicited contact."
