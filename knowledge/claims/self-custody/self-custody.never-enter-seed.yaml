    url: https://trezor.io/learn/security-privacy/personal-security-standards/scams-and-phishing
    locator: No legitimate company asks for the backup
    quote: No legitimate company, including Trezor, will ever ask for your wallet backup.
    accessed: 2026-11-27
    supports: direct
  - tier: T2
    kind: docs
    title: Trezor Learn, Scams and phishing
    url: https://trezor.io/learn/security-privacy/personal-security-standards/scams-and-phishing
    locator: Phishing
    quote: any request for your wallet backup, PIN, passwords, or codes is always a scam.
    accessed: 2026-11-27
    supports: direct
  - tier: T2
    kind: docs
    title: FBI IC3 Public Service Announcement I-060325-PSA, 3 June 2025
    url: https://www.ic3.gov/PSA/2025/PSA250603
    locator: Tips on how to protect yourself
    quote: Do not respond to requests to provide personally identifying information, like passwords,
      seed phrases, or one-time passwords sent to your accounts if you did not initiate the
      outreach.
    published: 2025-06-03
    accessed: 2026-11-27
    supports: direct
