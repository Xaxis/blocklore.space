id: self-custody.never-enter-seed
statement: "Guidance against seed phishing treats requests for a seed phrase as a warning sign: a
  hardware wallet maker says any request for the wallet backup is a scam and no legitimate company
  will ask for one, and a June 2025 FBI advisory advises not responding to requests for seed phrases
  when the user did not initiate the outreach."
