id: bitcoin-core-development.sha256sums-six-builders
statement: Bitcoin Core's release process waits until 6 or more people have built the release with
  Guix and their results match, then combines every signer's all.SHA256SUMS.asc signature file into
  the single SHA256SUMS.asc published for users.
