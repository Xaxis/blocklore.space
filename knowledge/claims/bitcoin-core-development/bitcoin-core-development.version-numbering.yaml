id: bitcoin-core-development.version-numbering
statement: Bitcoin Core versions are numbered MAJOR.MINOR, such as 29.0 or 30.0, and release
  candidates for testing carry a suffix such as rc1 or rc2, according to the release lifecycle page
  on bitcoincore.org as read on 27 November 2026.
