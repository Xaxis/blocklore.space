id: bitcoin-core-development.guix-attestations
statement: Bitcoin Core's release process asks builders who reproduce a release with Guix to commit
  their signed SHA256SUMS attestations through a pull request to the bitcoin-core/guix.sigs
  repository, and the contrib/guix/guix-verify script lets a builder check other signers'
  attestations against their own.
