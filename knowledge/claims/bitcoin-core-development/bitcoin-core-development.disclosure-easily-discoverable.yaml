id: bitcoin-core-development.disclosure-easily-discoverable
statement: As published on bitcoincore.org on 27 November 2026, Bitcoin Core's disclosure timeline
  for a reported vulnerability depends first on whether the project classifies it as easily
  discoverable, in which case the project publishes a point release with the fix for each maintained
  major version as soon as possible.
