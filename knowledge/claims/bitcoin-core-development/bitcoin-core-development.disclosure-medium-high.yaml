id: bitcoin-core-development.disclosure-medium-high
statement: Under Bitcoin Core's security disclosure policy as published on bitcoincore.org on 27
  November 2026, Medium and High severity vulnerabilities not classified as easily discoverable are
  disclosed 2 weeks after the last affected release goes End of Life, with a pre-announcement 2
  weeks before the details are released.
