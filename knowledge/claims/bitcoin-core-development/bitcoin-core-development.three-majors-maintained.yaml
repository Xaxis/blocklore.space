id: bitcoin-core-development.three-majors-maintained
statement: The Bitcoin Core project maintains the latest three major versions at any time, according
  to its lifecycle page as read on 27 November 2026, which lists 30.x, 31.x and 32.x as maintained
  and 29.x as having reached End of Life on 27 October 2026.
