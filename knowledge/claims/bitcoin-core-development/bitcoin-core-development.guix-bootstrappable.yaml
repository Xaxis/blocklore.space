id: bitcoin-core-development.guix-bootstrappable
statement: Bitcoin Core's contrib/guix directory holds the files for its bootstrappable builds,
  which use GNU Guix as a functional package manager so that the project can audit and reproduce its
  build toolchain instead of trusting binary downloads, according to the directory's README.
