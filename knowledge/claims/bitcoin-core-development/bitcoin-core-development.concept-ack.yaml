id: bitcoin-core-development.concept-ack
statement: Bitcoin Core's contributing guide, as of commit dd96035e, defines a "Concept ACK" or
  "Concept NACK" as saying the reviewer does or does not agree with a pull request's general goal,
  and an "Approach ACK" or "Approach NACK" as agreeing with the goal while agreeing or not with the
  approach of the change.
