id: bitcoin-core-development.nack-rationale
statement: Bitcoin Core's contributing guide, at commit dd96035e, requires a NACK (an objection to a
  pull request) to give a reason why the change is not worthwhile, and says NACKs without reasoning
  may be disregarded.
