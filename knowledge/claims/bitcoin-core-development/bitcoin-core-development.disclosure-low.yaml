id: bitcoin-core-development.disclosure-low
statement: Under Bitcoin Core's security disclosure policy as published on bitcoincore.org on 27
  November 2026, a Low severity vulnerability that the project does not classify as easily
  discoverable is disclosed 2 weeks after the release of a major version that contains the fix.
