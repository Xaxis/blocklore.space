id: bitcoin-core-development.ai-policy
statement: Bitcoin Core's AI policy (doc/AI_POLICY.md at commit dd96035e) requires that a human
  author choose the work, understand the change and be responsible for any contribution made with AI
  tools, and that AI-derived context in comments be disclosed.
