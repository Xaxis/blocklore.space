id: bitcoin-core-development.verify-download
statement: The bitcoincore.org download page, as read on 27 November 2026, offers a SHA256SUMS file
  of checksums and a SHA256SUMS.asc file of signatures over those checksums for the latest release,
  and gives gpg --verify SHA256SUMS.asc SHA256SUMS as the command for checking the signatures.
