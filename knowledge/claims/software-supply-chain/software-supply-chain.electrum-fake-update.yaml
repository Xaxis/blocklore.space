id: software-supply-chain.electrum-fake-update
statement: In December 2018, Electrum's developers reported that servers the Electrum wallet
  connected to could show users arbitrary text telling them to download and install malware
  disguised as an update; Electrum 3.3.3 fixed the way that server text was displayed.
