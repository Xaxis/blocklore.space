id: software-supply-chain.xz-backdoor
statement: On 29 March 2024, a post to the oss-security mailing list disclosed that the upstream
  repository and release tarballs of the xz compression library had been backdoored. The flaw is
  CVE-2024-3094, affecting xz 5.6.0 and 5.6.1, which NVD scores 10.0 (critical).
