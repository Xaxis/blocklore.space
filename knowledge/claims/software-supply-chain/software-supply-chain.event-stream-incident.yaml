id: software-supply-chain.event-stream-incident
statement: In the 2018 event-stream incident, a malicious dependency added to the event-stream npm
  package carried code aimed at the Copay wallet; npm's blog post on the incident, dated 27 November
  2018, relayed Copay's confirmation that the malicious code was deployed in Copay versions 5.0.2
  through 5.1.0.
