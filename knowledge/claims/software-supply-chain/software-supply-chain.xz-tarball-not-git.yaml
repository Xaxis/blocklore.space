id: software-supply-chain.xz-tarball-not-git
statement: The 29 March 2024 disclosure of the xz backdoor (CVE-2024-3094) reported that the
  modified build script line that started the backdoor's injection appeared in the xz 5.6.0 and
  5.6.1 release tarballs but not in xz's git repository, so the tarballs differed from the git
  source.
