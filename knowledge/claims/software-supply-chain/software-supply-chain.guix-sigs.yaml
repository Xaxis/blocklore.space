id: software-supply-chain.guix-sigs
statement: The bitcoin-core/guix.sigs repository holds Guix build attestations for Bitcoin Core
  releases, one folder per release version and signer, and its all.SHA256SUMS files cover every
  binary uploaded to the website; builders add their PGP keys to its builder-keys folder.
