id: software-supply-chain.signed-tag
statement: Bitcoin Core's release process, as of November 2026, tags each version or release
  candidate in git with the make-tag.py script from bitcoin-maintainer-tools, which performs a few
  last-minute consistency checks on the build system files and, if they pass, creates a signed tag.
