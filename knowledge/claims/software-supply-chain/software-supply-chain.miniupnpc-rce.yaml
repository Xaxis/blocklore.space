id: software-supply-chain.miniupnpc-rce
statement: On 3 July 2024, Bitcoin Core disclosed that bugs in miniupnpc, a library it then used for
  UPnP, could have led to remote code execution in Bitcoin Core versions before 0.12, an issue the
  project rated Medium severity.
