id: software-supply-chain.combined-signatures
statement: As of November 2026, Bitcoin Core's release process creates the SHA256SUMS.asc file
  uploaded to bitcoincore.org by concatenating the all.SHA256SUMS.asc signature files from all
  signers of that release in the guix.sigs repository.
