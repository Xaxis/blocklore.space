id: software-supply-chain.verify-commits
statement: As of commit 3e4c803 (November 2026), Bitcoin Core's contrib/verify-commits directory,
  which its README calls an incomplete work in progress, holds a Python 3 script that checks commits
  against a trusted-keys list of PGP fingerprints of authorized commit signers, and a pre-push hook
  script for maintainers to ensure their own commits are PGP signed.
