id: software-supply-chain.drop-miniupnpc
statement: "Bitcoin Core 29.0 removed the MiniUPnPc and libnatpmp libraries as dependencies,
  dropping UPnP support and replacing libnatpmp with a built-in implementation of PCP and NAT-PMP
  (Bitcoin Core PRs #31130 and #30043)."
