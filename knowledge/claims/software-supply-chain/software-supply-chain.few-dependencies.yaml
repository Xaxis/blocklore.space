id: software-supply-chain.few-dependencies
statement: As of commit 3e4c803 on Bitcoin Core's master branch (November 2026), doc/dependencies.md
  lists only Boost and CMake as required build dependencies and glibc as the only required runtime
  dependency; Qt, SQLite, ZeroMQ and the rest are optional.
