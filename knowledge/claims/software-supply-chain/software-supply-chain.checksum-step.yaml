id: software-supply-chain.checksum-step
statement: On Linux, bitcoincore.org's instructions check a Bitcoin Core download with the command
  "sha256sum --ignore-missing --check SHA256SUMS", and the check passes when the output lists OK
  after the name of the downloaded release file.
