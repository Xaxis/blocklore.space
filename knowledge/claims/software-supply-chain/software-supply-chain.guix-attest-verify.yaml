id: software-supply-chain.guix-attest-verify
statement: "Bitcoin Core ships two scripts for builder attestations: contrib/guix/guix-attest, which
  records a builder's signed hashes of their Guix build outputs in a guix.sigs checkout, and
  contrib/guix/guix-verify, which compares those attestations with other signers'. Bitcoin Core PR
  #21462 added them in 2021."
