id: software-supply-chain.download-files
statement: "As of November 2026, Bitcoin Core's download page provides two files for checking a
  release: SHA256SUMS, a list of SHA-256 checksums of the release files, and SHA256SUMS.asc, which
  holds signatures attesting that those checksums are valid."
