id: software-supply-chain.verify-binaries
statement: "As of commit 3e4c803 (November 2026), Bitcoin Core's contrib/verify-binaries script
  automates download checking: it fetches a release's SHA256SUMS file and its signature file, and
  first checks whether the checksum file is valid based on a plurality of signatures."
