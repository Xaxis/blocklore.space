id: software-supply-chain.signature-step
statement: After the checksum check, bitcoincore.org's instructions verify SHA256SUMS.asc against
  SHA256SUMS with gpg, which prints a separate signature check for each public key that signed the
  checksums, so one Bitcoin Core release carries signatures from several people.
