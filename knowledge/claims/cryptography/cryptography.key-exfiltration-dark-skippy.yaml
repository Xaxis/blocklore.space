id: cryptography.key-exfiltration-dark-skippy
statement: "Bitcoin Optech Newsletter #315 (9 August 2024) describes key exfiltration, where signing
  code deliberately makes signatures that leak information about the key, and reports Dark Skippy,
  an improved method with which a signing device with corrupted firmware or hardware can quickly
  leak a seed even if the device never connects to a computer."
