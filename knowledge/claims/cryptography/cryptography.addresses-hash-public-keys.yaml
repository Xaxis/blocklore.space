id: cryptography.addresses-hash-public-keys
statement: A common Bitcoin address type (P2PKH) is built from a hash of a public key rather than
  the key itself; the Bitcoin developer guide says the hash shortens the key and guards against
  unforeseen problems that might let private keys be rebuilt from public key data.
