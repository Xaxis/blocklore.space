id: cryptography.grover-double-security-bits
statement: Bitcoin Optech's quantum resistance topic says the loss of security that Grover's
  algorithm would cause in hash functions can be overcome by using a roughly equivalent algorithm
  with twice as many security bits, for example going from SHA256 to SHA512.
