id: cryptography.long-and-short-exposure
statement: BIP 360 distinguishes long exposure quantum attacks, on public keys or scripts already
  visible in the blockchain, from short exposure attacks, which must recover a key while its
  spending transaction waits unconfirmed in the mempool and so would need faster quantum computers.
kind: definition
