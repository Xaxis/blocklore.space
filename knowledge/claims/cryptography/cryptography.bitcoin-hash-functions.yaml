id: cryptography.bitcoin-hash-functions
statement: "Bitcoin Core defines two composite hashes in src/hash.h: CHash256, Bitcoin's 256-bit
  hash, which is SHA-256 applied twice, and CHash160, Bitcoin's 160-bit hash, which is SHA-256
  followed by RIPEMD-160 (as of the master commit 3e4c803 read on 25 November 2026)."
