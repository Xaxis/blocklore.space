id: cryptography.bip146-ecdsa-malleability
statement: "BIP 146, whose status is Closed as of block 977,885, describes an inherent ECDSA
  signature malleability: negating the S value of a valid signature modulo the curve order leaves it
  valid. Its LOW_S rule requires S to be at most the curve order divided by 2."
