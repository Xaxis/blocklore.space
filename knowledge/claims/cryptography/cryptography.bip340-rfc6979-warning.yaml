id: cryptography.bip340-rfc6979-warning
statement: BIP 340 warns that if a Schnorr signer computes its 32-byte rand value, the input from
  which its nonce is derived, as per RFC 6979 while the same secret key is also used for
  deterministic ECDSA under RFC 6979, the signatures can leak the secret key through nonce reuse.
