id: cryptography.bip340-tagged-hashes
statement: "BIP 340 describes tagged hashes: a hash function can be tweaked with a context-dependent
  tag name so that hashes used in one context are not reinterpreted in another, with collisions
  across contexts assumed to be infeasible for schemes that use a unique tag name."
