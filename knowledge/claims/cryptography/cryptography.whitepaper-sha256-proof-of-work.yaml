id: cryptography.whitepaper-sha256-proof-of-work
statement: "The Bitcoin whitepaper builds its proof-of-work on a hash function: the work is scanning
  for a value that, when hashed with a function such as SHA-256, gives a hash beginning with a
  number of zero bits, and the result can be verified by computing a single hash."
