id: cryptography.android-2013-key-rotation
statement: "Bitcoin.org's alert of 11 August 2013 on the Android random number weakness said that
  re-securing existing wallets required key rotation: generating a new address with a repaired
  random number generator and then sending all the money in the wallet to it."
