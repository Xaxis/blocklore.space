id: cryptography.core-ecdsa-signs-with-rfc6979
statement: As of the Bitcoin Core master commit 3e4c803 read on 25 November 2026, Bitcoin Core's
  ECDSA signing function CKey::Sign in src/key.cpp calls libsecp256k1's secp256k1_ecdsa_sign with
  the RFC 6979 nonce function, secp256k1_nonce_function_rfc6979, to derive its signing nonces.
