id: cryptography.android-securerandom-2013
statement: On 11 August 2013, bitcoin.org published an alert that Android's secure random number
  component had critical weaknesses affecting wallets generated by Android apps; on 14 August 2013
  Google's Android team attributed the problem to improper initialization of the underlying random
  number generator.
