id: cryptography.bip66-openssl-consensus-risk
statement: "BIP 66 explains a risk from bugs and changes in signature-checking code: Bitcoin's
  reference implementation then relied on OpenSSL, which does not guarantee identical behaviour
  between versions, and when OpenSSL 1.0.0p and 1.0.1k stopped accepting some non-DER signatures,
  some nodes rejected the chain."
