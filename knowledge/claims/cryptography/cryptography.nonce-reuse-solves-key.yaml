id: cryptography.nonce-reuse-solves-key
statement: "Nonce reuse gives away a private key: Bitcoin Optech Newsletter #161 (11 August 2021)
  explains that if a signer reuses the same nonce in two different signatures, the two signature
  equations can be combined so the nonce cancels out, leaving the private key as the only unknown,
  which someone can then solve for."
