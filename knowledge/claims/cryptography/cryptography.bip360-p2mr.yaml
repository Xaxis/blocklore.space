id: cryptography.bip360-p2mr
statement: BIP 360, a Draft as of block 977,435, specifies Pay-to-Merkle-Root (P2MR), a soft fork
  output type with nearly the same functionality as Pay-to-Taproot but without the key path spend,
  committing to a script tree's Merkle root instead of a public key, which the BIP describes as
  resistant to long exposure quantum attacks.
