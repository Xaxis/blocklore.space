id: cryptography.bip361-phases
statement: "BIP 361, a Draft as of block 977,435, proposes a phased sunset of ECDSA and Schnorr
  signatures after a post-quantum output type exists: Phase A would disallow sending funds to
  quantum-vulnerable addresses, and Phase B would restrict ECDSA and Schnorr spends to a
  quantum-safe rescue protocol."
