id: cryptography.libsecp256k1-side-channels
statement: libsecp256k1's README (as bundled in Bitcoin Core at commit afedb19cca4c) says its
  signing point multiplication is intended to be completely free of timing side channels for
  secret-key operations on reasonable hardware and toolchains, and offers optional runtime blinding
  that attempts to frustrate differential power analysis.
