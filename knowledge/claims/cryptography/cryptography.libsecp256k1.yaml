id: cryptography.libsecp256k1
statement: libsecp256k1 is the C library for signatures on the secp256k1 curve that Bitcoin Core
  bundles in src/secp256k1; its README lists ECDSA signing and verification, constant-time signing
  and public key generation, RFC 6979 nonces and an optional BIP 340 Schnorr module (as of the
  master commit 3e4c803 read on 25 November 2026).
