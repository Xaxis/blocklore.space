id: cryptography.core-low-s-trace
statement: "Bitcoin Core checks the LOW_S rule in src/script/interpreter.cpp: when the
  SCRIPT_VERIFY_LOW_S flag is set, CheckSignatureEncoding calls IsLowDERSignature, which fails the
  script with SCRIPT_ERR_SIG_HIGH_S when CPubKey::CheckLowS rejects the signature (as of the master
  commit afedb19 read on 28 November 2026)."
