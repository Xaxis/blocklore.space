id: cryptography.core-verify-trace
statement: Bitcoin Core checks ECDSA signatures in CPubKey::Verify, which normalizes the signature
  and calls libsecp256k1's secp256k1_ecdsa_verify, and checks BIP 340 Schnorr signatures in
  XOnlyPubKey::VerifySchnorr, which calls secp256k1_schnorrsig_verify, both in src/pubkey.cpp (as of
  the master commit 3e4c803 read on 25 November 2026).
