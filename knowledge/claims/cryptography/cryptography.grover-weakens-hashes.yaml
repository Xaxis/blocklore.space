id: cryptography.grover-weakens-hashes
statement: Bitcoin Optech's quantum resistance topic says that Grover's algorithm, run on an
  idealized quantum computer, would reduce the security strength of the hash functions Bitcoin uses
  (SHA256, SHA256d and RIPEMD160) to its square root, a weakening rather than the complete break
  Shor's algorithm would cause for ECDSA.
