id: cryptography.bip340-non-malleable
statement: "BIP 340 gives provable security and non-malleability as reasons for Schnorr signatures:
  it states they are provably secure in the random oracle model assuming the hardness of the
  elliptic curve discrete logarithm problem, and that their SUF-CMA security implies they are
  non-malleable."
