id: cryptography.rfc6979-deterministic-nonces
statement: RFC 6979, published in August 2013, defines a deterministic way to generate DSA and ECDSA
  signatures that does not need a source of high-quality randomness, and whose signatures unmodified
  standard verifiers accept.
