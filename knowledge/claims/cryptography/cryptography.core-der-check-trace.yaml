id: cryptography.core-der-check-trace
statement: "Bitcoin Core implements BIP 66's strict DER rule in src/script/interpreter.cpp:
  IsValidSignatureEncoding checks a signature's byte layout, and CheckSignatureEncoding fails the
  script with SCRIPT_ERR_SIG_DER when a non-empty signature fails that check while the DERSIG, LOW_S
  or STRICTENC flag is set (as of the master commit 3e4c803 read on 25 November 2026)."
