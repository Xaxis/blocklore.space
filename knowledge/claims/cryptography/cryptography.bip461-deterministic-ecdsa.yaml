id: cryptography.bip461-deterministic-ecdsa
statement: "BIP 461, a Draft as of block 977,885, specifies an ECDSA signing algorithm whose output
  is fully determined by the secret key and the message, so a key holder can sign the same message
  on two independent signers and compare: any difference shows that at least one is not following
  the specification, which could indicate an attempt to leak key material through nonce selection."
