id: cryptography.bip361-hardened-rescue
statement: BIP 361, a Draft as of block 977,885, leaves its quantum-safe rescue protocols to be
  designed, but says any BIP 32 wallet that uses a hardened derivation step in its key paths could
  satisfy one that proves knowledge of a parent extended private key, which a quantum attacker would
  be very unlikely to know.
