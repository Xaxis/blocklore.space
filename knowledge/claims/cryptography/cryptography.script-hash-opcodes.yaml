id: cryptography.script-hash-opcodes
statement: "Bitcoin Script exposes hash functions as opcodes: in Bitcoin Core's EvalScript,
  OP_RIPEMD160 is computed with CRIPEMD160, OP_SHA256 with CSHA256, OP_HASH160 with CHash160 and
  OP_HASH256 with CHash256 (as of the master commit 3e4c803 read on 25 November 2026)."
