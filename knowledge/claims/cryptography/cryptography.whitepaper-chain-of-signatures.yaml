id: cryptography.whitepaper-chain-of-signatures
statement: "The Bitcoin whitepaper defines an electronic coin as a chain of digital signatures: each
  owner passes the coin on by signing a hash of the previous transaction and the next owner's public
  key, and the person being paid can check the signatures to verify the chain of ownership."
