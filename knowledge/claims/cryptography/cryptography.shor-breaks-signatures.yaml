id: cryptography.shor-breaks-signatures
statement: A large enough quantum computer running Shor's algorithm could derive a private key from
  its public key, which would break the ECDSA and Schnorr signatures Bitcoin uses; BIP 360 calls
  such a machine a cryptographically relevant quantum computer (CRQC).
