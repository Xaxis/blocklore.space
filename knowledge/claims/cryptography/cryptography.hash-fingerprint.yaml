id: cryptography.hash-fingerprint
statement: "A cryptographic hash function such as SHA-256, as learnmeabitcoin.com explains it,
  creates a fingerprint for data: the same data always gives the same result, the smallest change to
  the data gives a completely different result, and working back from the result to the original
  data is computationally infeasible."
