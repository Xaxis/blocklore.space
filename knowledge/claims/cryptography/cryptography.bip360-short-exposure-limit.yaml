id: cryptography.bip360-short-exposure-limit
statement: BIP 360, a Draft as of 26 November 2026, states that its Pay-to-Merkle-Root outputs do
  not by themselves protect against short exposure quantum attacks, and that such protection may
  require adding post-quantum signatures to Bitcoin, which the BIP does not include.
