id: cryptography.what-a-signature-does
statement: In the Bitcoin developer guide's example payment, the receiver first generates a private
  key (256 bits of random data) and a public key made from it; when the coins are spent, a signature
  lets the network verify that the spender owns the private key which created that public key.
