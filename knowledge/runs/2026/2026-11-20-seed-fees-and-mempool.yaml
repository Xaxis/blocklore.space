summary: Seeded the fees-and-mempool topic with 37 candidate claims from Bitcoin Core code and
  release notes at f498a5a6, Bitcoin Knots code at 5811235e, BIPs 125, 141 and 431, Optech topics
  and newsletters, a Delving post and the April to May 2025 bitcoindev thread on OP_RETURN. Bitcoin
  Core 30.0 lowered the default minimum relay fee to 0.1 sat/vB and raised -datacarriersize to
  100,000; Bitcoin Core 31.0 shipped cluster mempool with feerate-diagram RBF checks and removed the
  CPFP carve-out. Bitcoin Knots' 29.x-knots branch keeps an 83-byte datacarrier default, a 1 sat/vB
  minimum relay fee and enables -rejectparasites and -rejecttokens by default. The OP_RETURN dispute
  is mapped as three attributed arguments for relaxing the limit and three against, with no position
  taken.
