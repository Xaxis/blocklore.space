rejected:
  - statement: Peter Todd's Bitcoin Core PR
    reason: "research: Kept the debate to three attributed arguments per side for balance; the PR was
      fetched and could become an argument claim later."
  - statement: Bitcoin Knots disables -permitbaremultisig by default while Bitcoin Core enables it.
    reason: "research: Verified in code but out of the OP_RETURN scope; a candidate for a later
      Knots-versus-Core policy topic."
  - statement: Bitcoin Core 30.0 lowered -blockmintxfee to 0.001 sat/vB.
    reason: "research: Supported by the 30.0 release notes but secondary; left out to keep the claim
      count focused."
  - statement: Bitcoin Core 29.0 introduced ephemeral dust (one zero-value output in a zero-fee
      transaction spent in the same package).
    reason: "research: Supported by release notes, but it needs its own claims on P2A and ephemeral
      anchors to be useful."
  - statement: BIP 110 and other consensus proposals restricting data.
    reason: "research: Consensus proposals are outside this topic's relay-policy scope; they belong on
      their own proposal pages."
  - statement: Optech's summary that Pieter Wuille argued blocks are full whether or not they contain
      data, so storage needs are similar either way.
    reason: "research: Could not tie the Optech sentence to a specific Wuille message I fetched, so I
      did not attribute it."
