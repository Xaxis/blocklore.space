summary: "Seeded the Taproot topic with 28 candidate claims from BIPs 327, 340, 341, 342 and 350 at
  bips commit a7f91321, Bitcoin Core code at f498a5a6 and at the v22.0 tag commit a0988140, the
  merge and activation PRs, Optech newsletters #153 and #175, and the chain. A notable finding:
  current Bitcoin Core master no longer contains a Taproot version bits deployment or the line
  \"min_activation_height = 709632\" (the CLAIMS.md example cites it at master and would fail its
  check). Since PR #23536 Taproot rules are enforced on all SegWit blocks with one exception block
  (692,261), so the 709,632 height is checked against v22.0 code, BIP 341's Deployment section and
  the chain instead. Adoption figures come from one dated mailing-list message by Murch (July
  2025)."
