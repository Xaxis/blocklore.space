summary: "Built the consensus-security topic from scratch: 40 candidate claims covering why nodes
  check value rules, the 2010 value overflow (CVE-2010-5139), CVE-2018-17144, the merkle tree
  weaknesses CVE-2012-2459 and CVE-2017-12842 plus the 2024 mutated-block advisory, BIP 30 and BIP
  34, the 2013 (BIP 50) and 2015 (BIP 66) chain splits, and the issues BIP 54 addresses. Builder
  claims cite the BIPs at bips commit 0d99ffd, Bitcoin Core code and functional tests at commit
  dbe9eac, the 0.16.3 release notes, and the original 2010 fix commit d4c6b90. User and Holder
  claims rest on Bitcoin Core's lifecycle and security advisory pages."
