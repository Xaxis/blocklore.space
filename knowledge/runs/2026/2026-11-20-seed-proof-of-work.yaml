summary: "Seeded the proof-of-work topic with 31 candidate claims covering all five depths. Builder
  claims are traced to Bitcoin Core at f498a5a6 (pow.cpp, chainparams.cpp, chain.h, chain.cpp,
  validation.cpp, miner.cpp, arith_uint256.h), with code.contains and chain.header checks on blocks
  0, 32,255 and 32,256. Researcher claims describe the timewarp off-by-one, BIP 54 and BIP 94 at
  bips a7f91321, the Bitcoin Core miner change from PR #35949 and the still-open PR #35793, plus two
  selfish mining papers."
