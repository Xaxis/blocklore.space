open:
  - The total-under-21-million and subsidy-reaches-zero claims are derived arithmetic from
    GetBlockSubsidy; a Stack Exchange or Optech source stating 2,099,999,997,690,000 sats and block
    6,930,000 would raise confidence to high.
  - Whether the CCAF fee-share figure matches the chain could be settled with a fee-sum check over
    the stated 90 days, which the current check types do not support.
  - "Line ranges for validation.cpp other than GetBlockSubsidy (L1827-L1838, from the example) were
    not confirmed, so those URLs carry no #L anchor."
  - Peter Todd's 2022 tail emission arguments should be added as attributed argument claims once the
    exact message id of the relevant post is located on gnusha.org or mailing-list.bitcoindevs.xyz.
