summary: Seeded the halvings-and-supply topic with 29 candidate claims, from the definition of the
  block subsidy to the debate over fees and long-run security. The core schedule rests on Bitcoin
  Core code at f498a5a6 (GetBlockSubsidy, nSubsidyHalvingInterval, MAX_MONEY, the coinbase limit,
  gettxoutsetinfo) and on BIPs 30, 34, 42 and 54, with chain.subsidy checks on each halving block
  and the block before it, plus block hashes and timestamps read from mempool.space. The
  20,999,999.9769 BTC total is computed from the code (sum over 33 eras of 210,000 times
  5,000,000,000 sats shifted right) and cross-checked against a T3 source, because Stack Exchange
  and learnmeabitcoin could not be fetched. The security budget is presented as an open, contested
  question with four attributed arguments from Delving Bitcoin and one dated data point on fee share
  from a CCAF report.
