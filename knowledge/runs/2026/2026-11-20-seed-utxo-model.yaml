summary: Seeded the UTXO model topic with 37 candidate claims from the white paper, Bitcoin Core at
  commit f498a5a6, BIPs 30, 34 and 141, the Bitcoin Core 28.0 release notes, Optech topic pages, two
  IACR ePrint papers and two assumeutxo pull requests. Code claims carry code.contains checks, and
  the BIP 30, BIP 34 and assumeutxo heights carry chain.block-hash checks with hashes taken from
  Bitcoin Core's source. The only dated UTXO set counts with a primary source were the dumptxoutset
  outputs posted in reviews of the assumeutxo PRs (176,948,713 outputs at block 840,000, 184,821,030
  at block 880,000).
