rejected:
  - statement: SegWit's BIP 9 deployment locked in at block 479,808, on 9 August 2017.
    reason: "research: No T1 or T2 source fetched in this run states the lock-in height; it follows
      arithmetically (481,824 minus 2,016) but only media, a gist and a blocked learnmeabitcoin page
      carried it."
  - statement: BIP 91 locked in at block 477,120 and activated around 23 July 2017.
    reason: "research: Only media sources and an explorer page; no primary or T2 source fetched."
  - statement: The New York Agreement and SegWit2x proposal and its withdrawal.
    reason: "research: Out of scope for this seed and contested; would need primary statements from
      signatories and opponents."
  - statement: Most wallets default to SegWit addresses.
    reason: "research: No count or method; replaced by the dated Bitcoin Core default."
  - statement: BIP 141 block weight rule quoted directly from the BIP.
    reason: "research: The raw mediawiki line wraps terms in '' markup; cited the code comment instead,
      BIP only partially."
