open:
  - The exact lock-in height and dates for BIP 91 and SegWit's own deployment need a primary or T2
    source; a Bitcoin Stack Exchange answer (API unreachable this run) or reading version-bit state
    from a node (getdeploymentinfo at heights 479,807 and 479,808) would settle them.
  - The witness discount's rationale and its critics (for example data embedding in witnesses) are
    not covered; that needs attributed argument claims from mailing-list posts with message ids.
  - Several BIP quotes come from raw mediawiki; if the checker does not strip markup, the BIP 141 "≤
    4,000,000." and BIP 173 lowercase quotes are the most likely to need adjustment.
  - BIP 148's preamble shows Status Deployed at this commit; whether that reflects a BIP 3 status
    migration was not investigated, so no bip.field check was added for it.
