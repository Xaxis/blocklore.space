summary: "Seeded the segwit topic with 34 candidate claims, from a plain definition to the BIP 141,
  143, 144, 145, 173 and 350 specifications, the Bitcoin Core code that implements them at commit
  f498a5a6, and the 2017 deployment history (BIP 9, BIP 91, BIP 148). The activation height 481,824
  is confirmed three ways: the SegwitHeight line and its hash comment in chainparams.cpp, the block
  hash from mempool.space, and the header time (24 August 2017). The history is told from the BIPs
  themselves and Optech's soft fork activation topic, with each BIP's stated aim attributed to its
  author and Optech's note that the relative contribution of each event is still debated."
