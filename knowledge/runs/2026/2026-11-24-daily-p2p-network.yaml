rejected:
  - statement: "(p2p-network.depends-on-honest-peers: withheld, it touches a gated subject)"
    reason: 'verifier: The guide says a dishonest sync node "will quickly be discovered ... as long as
      the IBD node connects to at least one honest peer". That makes one honest peer enough to
      detect it. The candidate turns this into a requirement: the node can detect a false chain
      "only while" it has an honest peer. That is stronger than the source and not accurate for
      current Bitcoin Core, which can also turn down a low-work header chain without any honest peer
      by checking it against its minimum chain work (headers presync, Bitcoin Core PR #25717). The
      opening clause, "sees only the blocks and transactions its peers send it", has no direct
      source. Source 1 is about DNS seeds, not peers in general. The guide is also out of date: the
      same passage says Bitcoin Core will keep providing checkpoints. A narrower claim would need a
      current source, so this is a reject, not a revise.'
