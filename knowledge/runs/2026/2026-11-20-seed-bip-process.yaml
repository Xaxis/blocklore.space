summary: Seeded the bip-process topic with 30 candidate claims. The bips README at commit a7f91321
  points to BIP 3 as the full process; BIP 3 has Status Deployed and BIP 2 is Closed, so BIP 3's
  four statuses (Draft, Complete, Deployed, Closed) and three types (Specification, Informational,
  Process) are described rather than BIP 2's. Activation is covered as dated facts from BIP 9, BIP
  8, BIP 141, BIP 341, Bitcoin Core release notes and current Core code (buried deployments, Taproot
  flags).
