rejected:
  - statement: "(covenants.open-demonstrated-demand: withheld, it touches a gated subject)"
    reason: "verifier: The question as framed is partly answered by sources in this same run, so it is
      not an honest open question. Steven Roose's Delving post (cited by
      covenants.argument-roose-first-step) says \"Very limited vaults have been built with CTV\",
      linking a working implementation. A search also found an April 2026 mailing-list report of an
      LN-Symmetry-style state chain run on Inquisition signet (with APO and CTV, not CSFS), which I
      could not verify. \"Critics say\" generalizes one person, Antoine Poinsot, who also wrote that
      he is sympathetic to a CTV+CSFS soft fork. And whether a demonstration is \"proper\" is partly
      a judgment that \"published implementations on signet\" would not settle. A narrower question,
      for example whether LN-Symmetry built with CTV and CSFS has been implemented and published as
      of a date, would need fresh research."
  - statement: "(covenants.open-empirical-and-value: withheld, it touches a gated subject)"
    reason: "verifier: This is Blocklore's own classification of the debate, not a claim any cited
      source makes. None of the sources says which questions are empirical and which are values that
      \"data cannot settle\". Towns, ZmnSCPxj and Poinsot/Sanders each argue a position. The
      ZmnSCPxj point about fungibility is partly empirical, so the value label is debatable. The
      claim is also not a question with stated resolution criteria, which the open-question kind
      requires (CLAIMS.md). Its one empirical example, CTV plus CSFS permitting a recursive
      covenant, is already shown by Towns' construction and covered by
      covenants.argument-ctv-csfs-recursion. Under EDITORIAL.md, empirical and value markings belong
      on debate-map nodes, not in a claim in the brain's voice."
  - statement: Recursive covenants could create miner extractable value beyond simple transaction selection.
    reason: "research: Optech"
  - statement: The December 2024 wiki poll of developer opinions on covenant proposals.
    reason: "research: A poll is evidence only of itself; Optech reports no results, and I did not read
      the wiki page, so it would add little."
  - statement: Shinobi's 2022 concern that recursive covenants threaten censorship resistance or fungibility.
    reason: "research: Only Optech's one-line summary was available; the primary message could not be
      fetched."
  - statement: Bitcoin Core does not implement any of these opcodes as of commit a690300e.
    reason: "research: An absence cannot be expressed as a code.contains check and I did not search the
      tree."
  - statement: Proponent-use claims for OP_CHECKCONTRACTVERIFY and OP_TXHASH comparable to the other
      proposals.
    reason: "research: Out of budget for this run; BIP 443 motivation and BIP 346 motivation should be
      read for attributed use claims (equal care gap)."
  - statement: The 2022 attempt to activate CTV through a Speedy Trial client.
    reason: "research: Not researched in this run; needs the 2022 mailing-list primaries."
