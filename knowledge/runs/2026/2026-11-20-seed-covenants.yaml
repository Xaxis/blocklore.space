summary: "Seeded the covenants topic with 36 candidate claims. I read BIPs 118, 119, 345, 346, 347,
  348, 349, 442 and 443 at bips commit a7f91321, Bitcoin Inquisition's interpreter at 3db09a1b, the
  Inquisition 29.1 and 29.2 release posts for signet activation heights, Bitcoin Core PR #31989, and
  the 2025 bitcoindev and Delving threads on CTV plus CSFS. I wrote one mechanism claim per proposal
  with a bip.field status check, attributed proponent and critic arguments to the posts where they
  were made, and kept empirical questions (recursion, demonstrated uses) apart from value
  questions."
