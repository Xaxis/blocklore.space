# The founding research agenda: the ten M1 topics from the brief, with the scope each research run
# is given. The owner's file; the brain proposes changes as pull requests.
topics:
  - slug: utxo-model
    title: The UTXO model
    group: foundations
    scope: >-
      How Bitcoin represents ownership as unspent transaction outputs rather than accounts. Curious:
      coins as outputs, spending as consuming outputs and creating new ones, change. User: why a
      wallet balance is a sum of outputs, confirmations, why one payment can use several inputs.
      Holder: address reuse and the privacy of input linking (common-input-ownership heuristic),
      coin control, dust. Builder: outpoints (txid and output index), scriptPubKey and witness,
      coinbase maturity of 100 blocks in the code, the UTXO set and Bitcoin Core's coins database
      (CCoinsView, chainstate), BIP 30 and BIP 34 on duplicate transactions. Researcher: UTXO set
      growth (dated figures with sources), assumeutxo, Utreexo. Cite the white paper, the code at a
      commit and Optech; add chain checks where a block is named.

  - slug: proof-of-work
    title: Proof of work and difficulty
    group: mining
    scope: >-
      Curious: what mining does and why it costs energy, roughly ten minutes per block. User: why
      confirmation times vary. Holder: why accumulated work, not block count, decides the chain.
      Builder: the 80-byte header, double SHA-256, nBits and the target, the retarget every 2,016
      blocks toward two weeks with the factor-of-four clamp (src/pow.cpp and chainparams at a
      commit), median time past, chainwork. Researcher: the timewarp issue and how proposals address
      it (factual description only, linking BIP 54 consensus cleanup), selfish mining literature.
      Add chain.header checks on bits for named blocks and code.contains checks for the constants.

  - slug: halvings-and-supply
    title: Halvings and the supply schedule
    group: foundations
    scope: >-
      Curious: new bitcoin enter circulation only as the block subsidy, which halves every 210,000
      blocks. User: the four halvings so far (heights 210,000, 420,000, 630,000, 840,000) and the
      current subsidy of 3.125 BTC, the next at block 1,050,000. Holder: the supply limit and why
      the total is slightly under 21 million BTC, coins provably or plausibly lost, why exact supply
      needs a node (gettxoutsetinfo). Builder: GetBlockSubsidy and nSubsidyHalvingInterval in the
      code, the subsidy reaching zero, the unspendable genesis coinbase, BIP 30 duplicate coinbases.
      Researcher: fees versus subsidy as miner revenue over time, stated with dated data and
      sources; the long-run security budget is a debated question, so describe it as one,
      attributed, without taking a side. Add chain.subsidy checks for each halving height and the
      blocks before them.

  - slug: segwit
    title: Segregated Witness (SegWit)
    group: protocol
    scope: >-
      Curious: what SegWit changed in plain terms. User: native SegWit (bc1q) addresses and lower
      fees for SegWit spends. Holder: why most wallets default to SegWit. Builder: BIPs 141, 143,
      144, 145 and 173; weight units and the 4,000,000 weight limit; the witness discount; the
      malleability fix and why it enabled Lightning; witness versions and how they allow later
      upgrades (Taproot is version 1). Researcher: the activation at block 481,824 (the code's
      SegwitHeight with its hash comment), the deployment history as dated events with primary
      sources (BIP 9 signaling, BIP 91, BIP 148), described factually with attributions and no
      verdicts. Add chain.block-hash for 481,824 and code.contains checks.

  - slug: taproot
    title: Taproot
    group: protocol
    scope: >-
      Curious: what Taproot is and why it was added. User: bc1p addresses. Holder: privacy and
      efficiency of key-path spends, multisig that looks like single-sig. Builder: BIPs 340 (Schnorr
      signatures), 341 (Taproot spending rules), 342 (Tapscript), 350 (bech32m); key path versus
      script path; the script tree; implementing code at a commit (interpreter.cpp,
      SignatureHashSchnorr) and the merge PR. Researcher: the Speedy Trial activation and its
      parameters, enforcement from block 709,632 (verify against the code and the chain), adoption
      figures only with dated sources. Add chain.block-hash for 709,632 and code checks.

  - slug: lightning
    title: Lightning Network basics
    group: layers
    scope: >-
      Curious: payments off-chain over channels, settled on Bitcoin. User: invoices, routing fees,
      why a payment can fail, receiving needs inbound liquidity. Holder: custodial versus
      self-custodial Lightning wallets and the tradeoffs, channel backups, the need to watch the
      chain or use a watchtower. Builder: the BOLT specifications at a commit, funding and
      commitment transactions, HTLCs, onion routing, the four main implementations (LND, Core
      Lightning, Eclair, LDK). Researcher: open problems stated with sources (channel jamming,
      liquidity), recent spec work (splicing, BOLT 12 offers) as dated facts from the BOLTs
      repository and Optech. Network size figures only with a dated source and the method's limits.

  - slug: fees-and-mempool
    title: The fee market and mempool policy
    group: protocol
    scope: >-
      Curious: users bid fees for limited block space. User: fee rates in sat/vB, why fees vary, why
      a transaction can be stuck. Holder: replace-by-fee and child-pays-for-parent to speed one up.
      Builder: consensus rules versus node relay policy and why they differ; Bitcoin Core's mempool
      defaults at a commit (minimum relay fee, mempool size, RBF rules from BIP 125 and the full-RBF
      default with its release, TRUC transactions, package relay, cluster mempool status), fee
      estimation. Researcher: the dispute over data-carrying transactions and OP_RETURN policy
      (Bitcoin Core 30's change and Bitcoin Knots' different defaults): describe what each
      implementation does as dated facts from release notes and code, and each side's arguments
      attributed to who makes them, in their own words. Do not take a side.

  - slug: self-custody
    title: Self-custody basics
    group: custody
    scope: >-
      Safety advice, every claim reviewed by a person before it publishes. Curious: what holding
      your own keys means and what it protects against. User: what a seed phrase is (BIP 39) and
      that anyone who has it controls the coins, never typing it into a website. Holder: backups and
      where they fail (fire, theft, discovery), BIP 39 passphrases and their risks, hardware
      signers, multisignature setups and their tradeoffs, inheritance planning, physical threat
      awareness (cite incident data, for example jlopp/physical-bitcoin-attacks, with dates).
      Builder: BIP 32 derivation, descriptors, PSBT (BIP 174 and 370). Researcher: open questions in
      key management. Calm and specific: each recommendation names the threat it addresses and its
      cost. No product endorsements, no financial advice.

  - slug: bip-process
    title: The BIP process
    group: governance
    scope: >-
      Curious: a BIP is a design document, not a vote and not a law. User: why a BIP number does not
      mean adoption. Builder: the process documents in the bips repository at a commit (BIP 2 and
      its successor BIP 3 if it is active; check the current README and which process document is in
      force), statuses and what they mean, how numbers are assigned, the editors' role described
      from the documents, BIP types (Standards Track, Informational, Process) and layers.
      Researcher: soft fork activation happens through software releases and miner and node
      adoption, outside the BIP process; how past activations used BIP 9 and BIP 8, as dated facts.
      Add bip.field checks for statuses you cite. Avoid naming people unless the document does.

  - slug: covenants
    title: Covenant proposals
    group: governance
    scope: >-
      A contested topic: every claim is reviewed by a person. Curious: what a covenant is (rules on
      how coins may be spent next). Builder: each proposal with equal care and the same structure,
      from its BIP at a commit: OP_CHECKTEMPLATEVERIFY (BIP 119), OP_CHECKSIGFROMSTACK (BIP 348),
      OP_INTERNALKEY (BIP 349) and the LNHANCE bundle, OP_CAT (BIP 347), OP_CHECKCONTRACTVERIFY and
      OP_VAULT (BIP 345 and related), SIGHASH_ANYPREVOUT (BIP 118), and TXHASH if it has a BIP. For
      each: what it does, what its proponents say it enables (attributed), its BIP status (bip.field
      check), whether it runs on signet via Bitcoin Inquisition. Researcher: the arguments for and
      against activating covenants, each attributed with a link to where it was made (mailing list,
      Delving, Optech), the empirical questions separated from the value questions. No predictions
      about activation, no verdicts.

  # The security watch's topics (ARCHITECTURE.md, "The security watch"; knowledge/security/threats/
  # files each threat under one of these or an older topic). Until the owner lists them in
  # brain/policy/topics.yaml they count as contested, so every claim on them waits for review.
  - slug: consensus-security
    title: Consensus bugs and validation
    group: protocol
    scope: >-
      Known, publicly disclosed weaknesses in how nodes decide which blocks and transactions are
      valid, and what fixed or defends against each. Curious: why every node checking every rule is
      what keeps bitcoin from being created out of nothing. User and Holder: why running maintained
      software matters, from Bitcoin Core's advisories. Builder: CVE-2010-5139 (value overflow,
      block 74,638), CVE-2018-17144 (duplicate inputs), CVE-2012-2459 and CVE-2017-12842 (merkle
      tree weaknesses), BIP 30 and BIP 34 on duplicate transactions, the 2013 chain split (BIP 50)
      and the 2015 strict-DER split (BIP 66), each from its advisory, BIP or release notes at a
      commit, and the Bitcoin Core functional tests that check the fix (test/functional at a
      commit). Researcher: the remaining issues BIP 54 (consensus cleanup) addresses, as the BIP
      states them. Only what advisories, BIPs and release notes already made public; never how to
      carry out an attack beyond what they say.

  - slug: p2p-network
    title: The peer-to-peer network
    group: protocol
    scope: >-
      How Bitcoin nodes find and talk to each other, and the publicly known attacks on that network
      with their defenses. Curious: what a node is and why it connects to several others. User: why
      a node's view of the chain depends on honest peers. Builder: eclipse attacks (the 2015 paper
      by Heilman and others, and Bitcoin Core's defenses: outbound connection diversity, anchor
      connections, asmap, eviction protection), internet routing attacks, header-chain memory
      attacks and headers presync (Bitcoin Core PR #25717), stalling peers (CVE-2024-52922),
      disclosed denial-of-service bugs from bitcoincore.org's advisories, transaction origin privacy
      (BIP 324 encrypted transport, Tor and I2P support), each from the advisory, BIP, PR or paper,
      and the code at a commit. Only what is publicly disclosed; never instructions.

  - slug: cryptography
    title: Bitcoin's cryptography
    group: foundations
    scope: >-
      The cryptography Bitcoin relies on and the publicly known ways it can fail. Curious: what a
      digital signature and a hash do, in everyday terms. Holder: why a key made from weak
      randomness can be found by others (the Milk Sad disclosure, CVE-2023-39910; the 2013 Android
      SecureRandom alert). Builder: SHA-256 and RIPEMD-160 in Bitcoin, ECDSA and BIP 340 Schnorr
      signatures over secp256k1, deterministic nonces (RFC 6979, BIP 340's nonce derivation) and why
      nonce reuse leaks a key, libsecp256k1 and strict DER encoding (BIP 66). Researcher: what a
      large quantum computer would break and the proposals that respond (BIP 360, BIP 361), as the
      documents state them, attributed and without predictions. Dated facts from specifications,
      papers and advisories.

  - slug: software-supply-chain
    title: Software supply chain
    group: protocol
    scope: >-
      How Bitcoin software gets from its developers to users, and how that path is defended.
      Curious: why you should check that the software you download is the real one. User: how to
      verify a Bitcoin Core download (SHA256SUMS and its signatures), from bitcoincore.org's own
      instructions. Builder: reproducible Guix builds and the guix.sigs repository of builder
      attestations, signed release tags, how Bitcoin Core keeps dependencies few, and documented
      incidents elsewhere that show the risk (the 2018 event-stream package compromise that targeted
      a bitcoin wallet, the 2024 xz backdoor, CVE-2024-3094), each from a primary record. No product
      endorsements.
  - slug: transactions
    title: Transactions
    group: protocol
    scope: "What a Bitcoin transaction is, byte for byte. Curious: inputs spend earlier outputs, outputs
      lock new ones, and the fee is what is left over. User: confirmations, what a transaction id
      is, why a transaction can wait. Holder: change outputs, and replace-by-fee and
      child-pays-for-parent from the sender's side. Builder: the serialization in Bitcoin Core at a
      commit (version, inputs with their outpoint, scriptSig and sequence, outputs with value and
      scriptPubKey, locktime, and the segwit marker, flag and witness of BIP 144); txid versus wtxid
      (BIP 141); nLockTime and nSequence, including relative timelocks (BIPs 68, 112 and 113); the
      signature hash types and the digests of BIP 143 and BIP 341; weight and virtual size (BIP
      141); standardness limits in relay policy (maximum standard weight, dust) kept apart from
      consensus rules. Researcher: transaction malleability and how segwit removed third-party
      malleability, from the BIPs and the code. Add chain checks for any transaction or block
      named."
  - slug: script
    title: Bitcoin Script
    group: protocol
    scope: "The small programs that lock every coin. Curious: spending a coin means satisfying the
      program that locks it. User: why addresses start with 1, 3, bc1q or bc1p, and what each kind
      locks with. Builder: the Script language in Bitcoin Core at a commit (a stack machine with no
      loops, the opcodes in script.h, the opcodes disabled in 2010 and why, OP_CHECKSIG, and
      OP_CHECKMULTISIG with its extra stack item and NULLDUMMY in BIP 147); the standard output
      types P2PK, P2PKH, P2SH (BIP 16), P2WPKH and P2WSH (BIP 141) and P2TR (BIP 341); the timelock
      opcodes OP_CHECKLOCKTIMEVERIFY (BIP 65) and OP_CHECKSEQUENCEVERIFY (BIP 112); what Tapscript
      changed (BIP 342: OP_CHECKSIGADD, OP_SUCCESS, the signature budget); resource limits on script
      size, operations, stack and signature operations, each marked as consensus or relay policy.
      Researcher: proposals to change Script (OP_CAT, OP_CHECKSIGFROMSTACK and others) only as dated
      facts of what each BIP or draft specifies and its status; the arguments belong to the
      covenants topic."
  - slug: wallet-standards
    title: "Wallet standards: keys, descriptors and PSBT"
    group: custody
    scope: "The open standards that let one wallet's keys and transactions work in another. Curious: a
      wallet holds keys, not coins, and one seed can make every key. User: why a seed restores in
      another wallet only when both follow the same standards. Holder: what a passphrase adds,
      multisig as a set of keys and a policy, watch-only wallets. Builder: BIP 32 hierarchical
      deterministic keys (hardened and normal derivation, extended keys); BIP 39 mnemonics, their
      checksum and the PBKDF2 step; derivation paths in BIPs 44, 49, 84 and 86; output script
      descriptors (BIPs 380 to 386) and Bitcoin Core's descriptor wallets at a commit; miniscript
      (BIP 379) and what it lets software check about a policy; PSBT (BIP 174, version 2 in BIP 370,
      Taproot fields in BIP 371) and the roles in a signing flow; bech32 and bech32m (BIPs 173 and
      350). Researcher: silent payments (BIP 352) and its status. Never quote a seed, a key or an
      extended key, not even a published test vector; describe them instead."
  - slug: bitcoin-core-development
    title: How Bitcoin Core is built and released
    group: governance
    scope: "How the most used Bitcoin node software is reviewed, tested, built and released. Curious:
      Bitcoin Core is open source, and anyone can read and review it. User: how releases are
      numbered and how long each is maintained, from bitcoincore.org's lifecycle page. Builder: the
      contribution and review process in CONTRIBUTING.md at a commit (pull requests, the kinds of
      ACK, the maintainers' role in merging); the release process (release candidates, release
      notes, doc/release-process.md); reproducible Guix builds and the guix.sigs attestations; the
      signed SHA256SUMS a user checks; the tests (unit tests, functional tests in test/functional,
      fuzzing in src/test/fuzz) and continuous integration; the security disclosure policy and the
      advisories it has published. Researcher: counts of contributors or pull requests only from
      dated primary sources such as release notes. Cite the repository at a commit and
      bitcoincore.org."
