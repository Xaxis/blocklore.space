        halvings-and-supply.bip54-future-duplicates,
        utxo-model.consensus-cleanup-coinbase,
      ]
    must: [utxo-model.bip34-limit]
    note: "Some pre-BIP 34 coinbases could repeat; BIP 30 checks resume at block 1,983,702; BIP 54 would fix it."
  - id: g129
    q: "Where does Bitcoin Core keep the set of unspent coins?"
    kind: covered
