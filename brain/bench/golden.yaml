  - id: g119
    q: "Can I pick exactly which coins my Bitcoin Core wallet spends?"
    kind: covered
    expect: [utxo-model.coin-control, utxo-model.avoid-partial-spends]
    must: [utxo-model.coin-control]
    note: "Yes, coin control lets the user choose specific unspent outputs for a transaction."
  - id: g120
