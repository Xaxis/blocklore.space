# Blocklore golden question set. See brain/bench/README.md.
version: 1
questions:
  # covered: bip-process
  - id: g001
    q: "Who decides whether a Bitcoin Improvement Proposal gets adopted?"
    kind: covered
    expect: [bip-process.users-decide, bip-process.no-decision-body]
    must: [bip-process.users-decide]
    note: "No decision body governs BIPs; users and the community evaluate, adopt, ignore or reject them."
  - id: g002
    q: "Do I need anyone's permission to write a BIP?"
    kind: covered
    expect: [bip-process.anyone-may-submit, bip-process.mailing-list-first]
    must: [bip-process.anyone-may-submit]
    note: "Anyone may submit if the content is high quality; first sketch it on the mailing list."
  - id: g003
    q: "What's a BIP, in plain English?"
    kind: covered
    expect: [bip-process.what-a-bip-is]
    must: [bip-process.what-a-bip-is]
    note: "An improvement proposal, usually a concise technical description of one concept, feature or standard."
  - id: g004
    q: "If an idea gets an official BIP number, does that mean Bitcoin accepted it?"
    kind: covered
    expect: [bip-process.number-not-adoption, bip-process.not-consensus]
    must: [bip-process.number-not-adoption]
    note: "No: a number means in scope and formally complete, not a good idea, consensus or adoption."
  - id: g005
    q: "Which document sets the rules for the BIP process today, and what happened to BIP 2?"
    kind: covered
    expect: [bip-process.bip3-in-force, bip-process.bip2-closed]
    must: [bip-process.bip3-in-force]
    note: "BIP 3 is in force (Deployed, Process); BIP 2 is Closed and names BIP 3 as its replacement."
  - id: g006
    q: "When did the switch from BIP 2 to BIP 3 take effect in the bips repo?"
    kind: covered
    expect: [bip-process.bip3-activated]
    must: [bip-process.bip3-activated]
    note: "PR #1820 activating BIP 3 merged 14 January 2026, after a mailing list motion reported Nov 2025."
  - id: g007
    q: "How many statuses can a BIP have now, and what are they?"
    kind: covered
    expect: [bip-process.four-statuses]
    must: [bip-process.four-statuses]
    note: "Four under BIP 3: Draft, Complete, Deployed, Closed, down from nine under BIP 2."
  - id: g008
    q: "What does it take for a finished proposal to be marked Deployed?"
    kind: covered
    expect:
      [
        bip-process.deployed-status,
        bip-process.process-bip-rough-consensus,
        bip-process.four-statuses,
      ]
    must: [bip-process.deployed-status]
    note: "Evidence of active use for a Complete BIP; Process BIPs need a month of discussion and rough consensus."
  - id: g009
    q: "What happens to a draft BIP that the author abandons?"
    kind: covered
    expect: [bip-process.closed-status]
    must: [bip-process.closed-status]
    note: "After a year stalled anyone may propose Closed; Closed BIPs are kept as historical, not deleted."
  - id: g010
    q: "Do the BIP editors judge whether a proposal is a good idea?"
    kind: covered
    expect: [bip-process.editors-role, bip-process.number-not-adoption]
    must: [bip-process.editors-role]
    note: "No: editors check editorial criteria, assign a number and merge; they do not judge adoption."
  - id: g011
    q: "What happened to the Standards Track category of BIPs?"
    kind: covered
    expect: [bip-process.standards-track-renamed, bip-process.three-types]
    must: [bip-process.standards-track-renamed]
    note: "BIP 3 replaced it with the Specification type; the types are Specification, Informational, Process."
  - id: g012
    q: "My wallet says it follows the BIPs. Does that mean it supports BIP 39 seed words?"
    kind: covered
    expect: [bip-process.check-your-software, bip-process.repository-does-not-track-adoption]
    must: [bip-process.check-your-software]
    note: "Depends on the software; e.g. Bitcoin Core's doc/bips.md lists BIP 32 but not BIP 39."
  - id: g013
    q: "Under BIP 9, how did miners signal for a soft fork and how much support locked it in?"
    kind: covered
    expect: [bip-process.bip9-mechanism, segwit.bip9-deployment]
    must: [bip-process.bip9-mechanism]
    note: "A bit in the block version, tallied per 2,016-block period; 1,916 blocks (95%) to lock in on mainnet."
  - id: g014
    q: "What does the lockinontimeout flag in BIP 8 do, and how is BIP 8 different from BIP 9?"
    kind: covered
    expect: [bip-process.bip8-mechanism]
    must: [bip-process.bip8-mechanism]
    note: "Heights instead of timestamps; if set, the final period must signal so it locks in by the timeout."
  - id: g015
    q: "Which soft fork was the first to be deployed with version bits?"
    kind: covered
    expect: [bip-process.csv-activation]
    must: [bip-process.csv-activation]
    note: "CSV (BIP 68, 112, 113), signaled on bit 0 from May 2016 in Core 0.12.1, active since block 419,328."
  - id: g016
    q: "What is a buried deployment in Bitcoin Core?"
    kind: covered
    expect: [bip-process.buried-deployments, segwit.buried-deployment]
    must: [bip-process.buried-deployments]
    note: "After activation, a hardcoded height replaces version bits logic (BIP 90); CSV and segwit are buried."
  # covered: fees-and-mempool
  - id: g017
    q: "Why do Bitcoin fees go up when lots of people are transacting?"
    kind: covered
    expect: [fees-and-mempool.limited-block-space, fees-and-mempool.stuck-transaction]
    must: [fees-and-mempool.limited-block-space]
    note: "Blocks are capped at 4M weight units; users compete with fee rates and higher rates are mined first."
  - id: g018
    q: "What does sat/vB mean, and why does a bigger transaction cost more at the same rate?"
    kind: covered
    expect: [fees-and-mempool.fee-rate-units, segwit.virtual-size]
    must: [fees-and-mempool.fee-rate-units]
    note: "Satoshis per virtual byte; vsize is weight divided by 4, rounded up, so total fee scales with size."
  - id: g019
    q: "Is there one mempool that the whole network shares?"
    kind: covered
    expect: [fees-and-mempool.mempool-definition, fees-and-mempool.consensus-versus-policy]
    must: [fees-and-mempool.mempool-definition]
    note: "No: each node keeps its own set of unconfirmed transactions under its own local rules."
  - id: g020
    q: "My low-fee payment disappeared from some block explorers after a while. Where did it go?"
    kind: covered
    expect: [fees-and-mempool.mempool-full-eviction, fees-and-mempool.mempool-expiry]
    must: [fees-and-mempool.mempool-full-eviction]
    note: "Full 300 MB mempools evict low fee rate txs, and Core expires unconfirmed txs after 14 days."
  - id: g021
    q: "What can I do about a payment that has been stuck unconfirmed for hours?"
    kind: covered
    expect:
      [
        fees-and-mempool.rbf-definition,
        fees-and-mempool.cpfp-definition,
        fees-and-mempool.bumpfee-rpc,
      ]
    must: [fees-and-mempool.rbf-definition]
    note: "Replace it with a higher-fee version (RBF, Core's bumpfee) or spend an output in a high-fee child (CPFP)."
  - id: g022
    q: "Can the person receiving a stuck payment do anything to get it confirmed faster?"
    kind: covered
    expect: [fees-and-mempool.cpfp-definition, fees-and-mempool.package-relay-1p1c]
    must: [fees-and-mempool.cpfp-definition]
    note: "Yes: spend their output in a child with a high fee rate so miners take both (CPFP)."
  - id: g023
    q: "Does a transaction still have to opt in with BIP 125 to be replaceable on Bitcoin Core nodes?"
    kind: covered
    expect:
      [
        fees-and-mempool.full-rbf-option-removed,
        fees-and-mempool.full-rbf-default,
        fees-and-mempool.bip125-signaling,
      ]
    must: [fees-and-mempool.full-rbf-option-removed]
    note: "No: full RBF became default in 28.0 and 29.0 removed the option; signaling is not required."
  - id: g024
    q: "What's the lowest fee rate a default Bitcoin Core node will relay?"
    kind: covered
    expect: [fees-and-mempool.min-relay-fee, fees-and-mempool.policy-propagation-caveat]
    must: [fees-and-mempool.min-relay-fee]
    note: "0.1 sat/vB since Bitcoin Core 30.0, for both the minimum and incremental relay fee rates."
  - id: g025
    q: "What is cluster mempool, and which Bitcoin Core release shipped it?"
    kind: covered
    expect: [fees-and-mempool.cluster-mempool]
    must: [fees-and-mempool.cluster-mempool]
    note: "Bitcoin Core 31.0 (April 2026); clusters of up to 64 txs and 101 kvB replace ancestor limits."
  - id: g026
    q: "Why did Bitcoin Core 31 drop the CPFP carve-out, and what are contract protocols supposed to use instead?"
    kind: covered
    expect: [fees-and-mempool.cpfp-carveout-removed, fees-and-mempool.truc-rules]
    must: [fees-and-mempool.cpfp-carveout-removed]
    note: "Removed in 31.0 with cluster mempool; protocols are expected to use TRUC and sibling eviction."
  - id: g027
    q: "What is transaction pinning and why does Lightning care about it?"
    kind: covered
    expect: [fees-and-mempool.pinning, fees-and-mempool.truc-rules]
    must: [fees-and-mempool.pinning]
    note: "Abusing relay policy limits to block acceptance or fee bumping; TRUC (BIP 431) aims to make it harder."
  - id: g028
    q: "If I replace a 500 vB transaction, what's the minimum extra fee the new version must add?"
    kind: covered
    expect: [fees-and-mempool.rbf-pays-more, fees-and-mempool.min-relay-fee]
    must: [fees-and-mempool.rbf-pays-more]
    note: "At least the old total fee plus 50 sats: 500 vB at the 0.1 sat/vB incremental relay fee."
  - id: g029
    q: "Can a miner put a transaction in a block that my node would have refused to relay?"
    kind: covered
    expect: [fees-and-mempool.consensus-versus-policy]
    must: [fees-and-mempool.consensus-versus-policy]
    note: "Yes: relay policy is local and not applied to blocks; only consensus rules decide block validity."
  - id: g030
    q: "How does Bitcoin Core work out a fee rate for confirming within a given number of blocks?"
    kind: covered
    expect: [fees-and-mempool.fee-estimator]
    must: [fees-and-mempool.fee-estimator]
    note: "CBlockPolicyEstimator buckets observed txs by fee rate and tracks how fast each bucket confirms."
  - id: g031
    q: "What check does Bitcoin Core 31 use to decide that a replacement leaves the mempool better off?"
    kind: covered
    expect: [fees-and-mempool.rbf-feerate-diagram, fees-and-mempool.rbf-pays-more]
    must: [fees-and-mempool.rbf-feerate-diagram]
    note: "ImprovesFeerateDiagram: the mempool's feerate diagram must be strictly better after replacement."
  # covered: halvings-and-supply
  - id: g032
    q: "What's the block reward right now?"
    kind: covered
    expect: [halvings-and-supply.current-subsidy, halvings-and-supply.coinbase-limit]
    must: [halvings-and-supply.current-subsidy]
    note: "Subsidy is 3.125 BTC per block since the fourth halving at block 840,000, plus the block's fees."
  - id: g033
    q: "When is the next halving and what will the reward drop to?"
    kind: covered
    expect: [halvings-and-supply.next-halving, halvings-and-supply.about-four-years]
    must: [halvings-and-supply.next-halving]
    note: "Block 1,050,000, from 3.125 to 1.5625 BTC; set by block height, roughly every four years."
  - id: g034
    q: "Where do new bitcoins come from?"
    kind: covered
    expect: [halvings-and-supply.what-it-is, halvings-and-supply.coinbase-limit]
    must: [halvings-and-supply.what-it-is]
    note: "Only from the block subsidy miners pay themselves; it halves every 210,000 blocks."
  - id: g035
    q: "List the halvings so far: when each happened and how much the reward fell."
    kind: covered
    expect:
      [
        halvings-and-supply.first-halving,
        halvings-and-supply.second-halving,
        halvings-and-supply.third-halving,
        halvings-and-supply.fourth-halving,
      ]
    must:
      [
        halvings-and-supply.first-halving,
        halvings-and-supply.second-halving,
        halvings-and-supply.third-halving,
        halvings-and-supply.fourth-halving,
      ]
    note: "2012 (50 to 25), 2016 (25 to 12.5), 2020 (12.5 to 6.25), 2024 (6.25 to 3.125), with heights."
  - id: g036
    q: "Will there be exactly 21 million bitcoin in the end?"
    kind: covered
    expect: [halvings-and-supply.total-under-21-million, halvings-and-supply.max-money-not-supply]
    must: [halvings-and-supply.total-under-21-million]
    note: "No: the schedule issues at most 20,999,999.9769 BTC because halvings drop fractional sats."
  - id: g037
    q: "When does the last bit of new issuance happen, and at what block does it stop completely?"
    kind: covered
    expect: [halvings-and-supply.subsidy-reaches-zero, halvings-and-supply.shift-guard-bip42]
    must: [halvings-and-supply.subsidy-reaches-zero]
    note: "Subsidy is 1 sat for blocks 6,720,000 to 6,929,999 and zero from block 6,930,000."
  - id: g038
    q: "Could a miner award itself 100 BTC in a block if it wanted to?"
    kind: covered
    expect: [halvings-and-supply.coinbase-limit]
    must: [halvings-and-supply.coinbase-limit]
    note: "No: the coinbase may claim at most subsidy plus fees; nodes reject a block that claims more."
  - id: g039
    q: "What happens to bitcoin a miner forgets to claim in its block?"
    kind: covered
    expect: [halvings-and-supply.unclaimed-rewards]
    must: [halvings-and-supply.unclaimed-rewards]
    note: "No minimum claim; anything unclaimed is never paid to anyone (gettxoutsetinfo unclaimed_rewards)."
  - id: g040
    q: "Can the coins created in the very first block ever be spent?"
    kind: covered
    expect: [halvings-and-supply.genesis-unspendable, halvings-and-supply.started-at-50-btc]
    must: [halvings-and-supply.genesis-unspendable]
    note: "No: Core never connects the genesis block's transactions, so its 50 BTC never enters the UTXO set."
  - id: g041
    q: "How much of miners' income comes from fees compared with newly issued coins?"
    kind: covered
    expect: [halvings-and-supply.fee-share-of-revenue]
    must: [halvings-and-supply.fee-share-of-revenue]
    note: "Cambridge 2026: fees averaged 0.67% in the 90 days to 4 Oct 2026, rarely above 5% since 2010."
  - id: g042
    q: "What bug did BIP 42 point out in the subsidy code?"
    kind: covered
    expect: [halvings-and-supply.shift-guard-bip42]
    must: [halvings-and-supply.shift-guard-bip42]
    note: "Shift by 64 or more is undefined in C++, so issuance could restart; Core now returns zero from 64."
  - id: g043
    q: "How does Bitcoin Core calculate the subsidy for a given block height?"
    kind: covered
    expect: [halvings-and-supply.subsidy-rule]
    must: [halvings-and-supply.subsidy-rule]
    note: "GetBlockSubsidy: halvings = height / 210,000; shift 50 BTC in sats right by that count."
  - id: g044
    q: "Why are the 21 million figure, Core's MAX_MONEY and the actual supply three different numbers?"
    kind: covered
    expect:
      [
        halvings-and-supply.max-money-not-supply,
        halvings-and-supply.total-under-21-million,
        halvings-and-supply.exact-supply-needs-node,
      ]
    must: [halvings-and-supply.max-money-not-supply]
    note: "MAX_MONEY is a sanity bound; schedule falls short of 21M; real total comes from a node's UTXO set."
  - id: g045
    q: "Which early coinbase outputs were wiped out by duplicates and can never be spent?"
    kind: covered
    expect: [halvings-and-supply.bip30-overwritten-coinbases, utxo-model.bip30-unspendable]
    must: [halvings-and-supply.bip30-overwritten-coinbases]
    note: "Blocks 91,722 and 91,812, overwritten by identical coinbases in 91,842 and 91,880."
  # covered: lightning
  - id: g046
    q: "What is the Lightning Network, in simple terms?"
    kind: covered
    expect: [lightning.what-it-is, lightning.channel]
    must: [lightning.what-it-is]
    note: "Fast payments over channels between pairs of nodes, off chain; on-chain txs open and enforce channels."
  - id: g047
    q: "How can two people pay each other many times without every payment going on the blockchain?"
    kind: covered
    expect: [lightning.channel, lightning.what-it-is]
    must: [lightning.channel]
    note: "A payment channel: the two peers update balances by signing new transactions off chain."
  - id: g048
    q: "I opened a Lightning channel but nobody can pay me. Why?"
    kind: covered
    expect: [lightning.inbound-liquidity]
    must: [lightning.inbound-liquidity]
    note: "Receiving needs funds on the peer's side; a channel you fund yourself starts with the balance on yours."
  - id: g049
    q: "Why do Lightning payments sometimes fail even though I have enough balance?"
    kind: covered
    expect: [lightning.payment-failure, lightning.multipart-payments]
    must: [lightning.payment-failure]
    note: "Senders can't see balances inside others' channels; a hop short of funds fails the attempt."
  - id: g050
    q: "How long is a Lightning invoice valid for?"
    kind: covered
    expect: [lightning.invoice-expiry, lightning.bolt11-invoice]
    must: [lightning.invoice-expiry]
    note: "BOLT 11 expiry field in seconds; 3,600 seconds (1 hour) when the field is absent."
  - id: g051
    q: "How are BOLT 12 offers different from normal invoices, and when did they enter the spec?"
    kind: covered
    expect: [lightning.offers, lightning.bolt12-merged]
    must: [lightning.offers]
    note: "Longer-lived lno requests; payer fetches a fresh invoice over Lightning; merged 24 September 2024."
  - id: g052
    q: "Custodial versus self-custodial Lightning wallet: what's the real difference?"
    kind: covered
    expect: [lightning.custodial-wallets, lightning.custody-tradeoff]
    must: [lightning.custodial-wallets]
    note: "Who holds the keys; custodial is least demanding but relies on the third party."
  - id: g053
    q: "If my LND node dies, is my seed phrase enough to recover the money in my channels?"
    kind: covered
    expect: [lightning.channel-backups, lightning.old-state-danger]
    must: [lightning.channel-backups]
    note: "No: the seed recovers on-chain funds; channel funds need a Static Channel Backup so peers close."
  - id: g054
    q: "What stops my channel partner from cheating by publishing an earlier balance?"
    kind: covered
    expect: [lightning.commitment-revocation, lightning.to-self-delay, lightning.old-state-danger]
    must: [lightning.commitment-revocation]
    note: "Old states are revoked; the cheater's output is delayed, so the victim can take all with a penalty tx."
  - id: g055
    q: "Do I have to keep my Lightning node online all the time to stay safe?"
    kind: covered
    expect: [lightning.watch-the-chain, lightning.watchtowers]
    must: [lightning.watch-the-chain]
    note: "The chain must be watched, by your node or a watchtower; offline with no tower can lose funds."
  - id: g056
    q: "How do nodes charge for forwarding Lightning payments?"
    kind: covered
    expect: [lightning.routing-fees]
    must: [lightning.routing-fees]
    note: "Per channel: a base fee in millisatoshis plus a proportional fee in millionths (BOLT 7)."
  - id: g057
    q: "How can a payment pass through strangers' nodes without them being able to steal it?"
    kind: covered
    expect: [lightning.multi-hop-payment, lightning.htlc]
    must: [lightning.multi-hop-payment]
    note: "Hash-locked conditional payments (HTLCs); each hop is paid when the recipient reveals the preimage."
  - id: g058
    q: "Can I add money to an open Lightning channel without closing it first?"
    kind: covered
    expect: [lightning.splicing, lightning.splicing-merged]
    must: [lightning.splicing]
    note: "Yes, splicing (BOLT 2, bits 62/63) replaces the funding tx; merged into the spec 23 March 2026."
  - id: g059
    q: "What is channel jamming, why does the 483 HTLC limit matter, and has it been fixed?"
    kind: covered
    expect: [lightning.jamming-open-problem, lightning.channel-jamming, lightning.htlc-slot-limit]
    must: [lightning.jamming-open-problem]
    note: "DoS by unsettled payments filling slots; no defense specified in the BOLTs as of 20 Nov 2026."
  - id: g060
    q: "Which software projects implement Lightning?"
    kind: covered
    expect: [lightning.implementations]
    must: [lightning.implementations]
    note: "LND, Core Lightning, Eclair and LDK, each in its own repository."
  - id: g061
    q: "How does a Lightning node find out which channels exist?"
    kind: covered
    expect: [lightning.gossip]
    must: [lightning.gossip]
    note: "BOLT 7 gossip messages, including channel announcements that prove a channel exists."
  - id: g062
    q: "Why is each anchor output on a Lightning commitment transaction exactly 330 sats?"
    kind: covered
    expect: [lightning.anchor-outputs]
    must: [lightning.anchor-outputs]
    note: "BOLT 3 fixes anchors at 330 sats, which it gives as the default P2WSH dust limit."
  - id: g063
    q: "What changes about the funding output in a simple taproot channel?"
    kind: covered
    expect: [lightning.simple-taproot-channels, lightning.funding-output]
    must: [lightning.simple-taproot-channels]
    note: "The 2-of-2 multisig becomes one P2TR key via MuSig2; an extension doc outside the numbered BOLTs."
  - id: g064
    q: "Does every node on a Lightning route see who is paying whom?"
    kind: covered
    expect: [lightning.onion-routing]
    must: [lightning.onion-routing]
    note: "No: Sphinx onion routing (BOLT 4); a hop learns only its predecessor and successor."
  # covered: proof-of-work
  - id: g065
    q: "What are Bitcoin miners actually doing?"
    kind: covered
    expect: [proof-of-work.what-mining-is]
    must: [proof-of-work.what-mining-is]
    note: "Guessing: changing a number in a candidate block and hashing until the result meets the target."
  - id: g066
    q: "Why does a new block show up about every 10 minutes?"
    kind: covered
    expect: [proof-of-work.ten-minute-target, proof-of-work.retarget-interval]
    must: [proof-of-work.ten-minute-target]
    note: "Difficulty adjusts so blocks average about 10 minutes as computing power joins or leaves."
  - id: g067
    q: "How often does Bitcoin rebalance how hard it is to mine?"
    kind: covered
    expect: [proof-of-work.retarget-interval, proof-of-work.retarget-formula]
    must: [proof-of-work.retarget-interval]
    note: "Every 2,016 blocks: the two-week target timespan divided by 600-second spacing."
  - id: g068
    q: "If half the miners switched off tomorrow, what would happen to block times?"
    kind: covered
    expect: [proof-of-work.difficulty-fixed-within-period, proof-of-work.clamp-factor-four]
    must: [proof-of-work.difficulty-fixed-within-period]
    note: "Blocks slow until the next 2,016-block retarget, which can change the target by at most 4x."
  - id: g069
    q: "Why is a transaction with more confirmations harder to undo?"
    kind: covered
    expect: [proof-of-work.attacker-must-redo-work, utxo-model.confirmations]
    must: [proof-of-work.attacker-must-redo-work]
    note: "An attacker must redo the work of that block and every later one, then overtake the honest chain."
  - id: g070
    q: "When two versions of the chain compete, how does a node pick the real one?"
    kind: covered
    expect: [proof-of-work.most-work-chain, proof-of-work.chainwork-per-block]
    must: [proof-of-work.most-work-chain]
    note: "The valid chain with most accumulated work, not most blocks; chainwork sums each block's work."
  - id: g071
    q: "What's inside a block header and how big is it?"
    kind: covered
    expect: [proof-of-work.header-80-bytes]
    must: [proof-of-work.header-80-bytes]
    note: "80 bytes: version, previous hash, merkle root, time, nBits, nonce; work is over these bytes."
  - id: g072
    q: "Which hash function is used to mine Bitcoin blocks?"
    kind: covered
    expect: [proof-of-work.double-sha256, proof-of-work.what-mining-is]
    must: [proof-of-work.double-sha256]
    note: "SHA-256 applied twice to the serialized 80-byte header."
  - id: g073
    q: "How do you turn the nBits field into the actual target?"
    kind: covered
    expect: [proof-of-work.nbits-compact, proof-of-work.genesis-bits]
    must: [proof-of-work.nbits-compact]
    note: "Top byte is a base-256 exponent, low 23 bits the mantissa: target = mantissa * 256^(exp - 3)."
  - id: g074
    q: "What is the timewarp attack?"
    kind: covered
    expect: [proof-of-work.timewarp-attack, proof-of-work.retarget-window-off-by-one]
    must: [proof-of-work.timewarp-attack]
    note: "Majority hashrate lowers difficulty via timestamps, exploiting the off-by-one window (BIP 54)."
  - id: g075
    q: "Is any timewarp fix enforced on mainnet today, or only on test networks?"
    kind: covered
    expect:
      [
        proof-of-work.bip94-testnet4,
        proof-of-work.bip54-core-implementation-pr,
        proof-of-work.bip54-timewarp-rule,
      ]
    must: [proof-of-work.bip94-testnet4]
    note: "BIP 94 rule only on testnet4 and regtest; the BIP 54 PR is open and regtest-only; none on mainnet."
  - id: g076
    q: "What rule stops a miner from backdating a block's timestamp?"
    kind: covered
    expect: [proof-of-work.median-time-past]
    must: [proof-of-work.median-time-past]
    note: "A block's time must be later than the median of the previous 11 blocks' timestamps."
  - id: g077
    q: "Could a miner just write an easier difficulty into its own block header?"
    kind: covered
    expect: [proof-of-work.bad-diffbits, proof-of-work.hash-below-target]
    must: [proof-of-work.bad-diffbits]
    note: "No: Core rejects the header (bad-diffbits) unless nBits equals the value computed from the chain."
  - id: g078
    q: "Do Bitcoin block arrivals follow a Poisson process?"
    kind: covered
    expect: [proof-of-work.block-times-vary]
    must: [proof-of-work.block-times-vary]
    note: "A 2018 study found they do not follow a homogeneous Poisson process and proposed a refined model."
  - id: g079
    q: "Why does Bitcoin mining use so much electricity?"
    kind: covered
    expect: [proof-of-work.energy-cost, proof-of-work.what-mining-is]
    must: [proof-of-work.energy-cost]
    note: "Mining spends computer time and electricity, which the whitepaper likens to gold mining; no figures."
  # covered: segwit
  - id: g080
    q: "What is SegWit and what did it change?"
    kind: covered
    expect: [segwit.what-it-is, segwit.malleability-fix]
    must: [segwit.what-it-is]
    note: "A 2017 soft fork moving signatures into a separate witness structure outside what the txid covers."
  - id: g081
    q: "When did SegWit go live on mainnet?"
    kind: covered
    expect: [segwit.activation-height, bip-process.segwit-activation]
    must: [segwit.activation-height]
    note: "Enforced since block 481,824, mined 24 August 2017."
  - id: g082
    q: "Why do some Bitcoin addresses start with bc1q?"
    kind: covered
    expect: [segwit.native-address-prefix]
    must: [segwit.native-address-prefix]
    note: "Native SegWit v0 addresses use Bech32 (BIP 173) and start with bc1q on mainnet."
  - id: g083
    q: "How much smaller is a spend from a native SegWit address than from a legacy one, and why?"
    kind: covered
    expect: [segwit.spend-size-comparison, segwit.witness-discount]
    must: [segwit.spend-size-comparison]
    note: "141 vs 220 vbytes for 1-in 2-out, about 35% less, because witness bytes weigh 1 not 4."
  - id: g084
    q: "How does the SegWit discount work?"
    kind: covered
    expect: [segwit.witness-discount, segwit.block-weight]
    must: [segwit.witness-discount]
    note: "Non-witness bytes count 4 weight units, witness bytes 1 (WITNESS_SCALE_FACTOR); limit 4M."
  - id: g085
    q: "What's the difference between a txid and a wtxid?"
    kind: covered
    expect: [segwit.txid-and-wtxid]
    must: [segwit.txid-and-wtxid]
    note: "txid hashes the serialization without witness; wtxid hashes it with the witness."
  - id: g086
    q: "Can someone change my transaction's ID by tweaking its signature after I broadcast it?"
    kind: covered
    expect: [segwit.malleability-fix, segwit.txid-and-wtxid]
    must: [segwit.malleability-fix]
    note: "Not for SegWit spends: signatures sit in the witness, which the txid does not cover."
  - id: g087
    q: "Why did Lightning have to wait for SegWit?"
    kind: covered
    expect: [segwit.enables-lightning, segwit.malleability-fix]
    must: [segwit.enables-lightning]
    note: "The malleability fix lets unconfirmed tx chains be built trustlessly, which BIP 141 ties to Lightning."
  - id: g088
    q: "How did SegWit leave room for upgrades like Taproot?"
    kind: covered
    expect: [segwit.witness-versions-upgrade, segwit.taproot-is-v1]
    must: [segwit.witness-versions-upgrade]
    note: "Witness versions 1 to 16 were reserved; Taproot gave version 1 rules via a soft fork."
  - id: g089
    q: "Why do Taproot addresses use bech32m instead of plain bech32?"
    kind: covered
    expect: [segwit.bech32m-for-v1, segwit.bech32-error-detection, taproot.bc1p-addresses]
    must: [segwit.bech32m-for-v1]
    note: "BIP 350 keeps bech32 for v0 and specifies bech32m for v1+, after a weakness with inserted characters."
  - id: g090
    q: "If I mistype a bc1 address, will the checksum catch it?"
    kind: covered
    expect: [segwit.bech32-error-detection]
    must: [segwit.bech32-error-detection]
    note: "Bech32 guarantees detecting any error in up to 4 characters; v0 lengths avoid the insertion weakness."
  - id: g091
    q: "What did BIP 143 change about how SegWit signatures are hashed?"
    kind: covered
    expect: [segwit.bip143-sighash, segwit.input-value-signed]
    must: [segwit.bip143-sighash]
    note: "New sighash avoids quadratic hashing and commits to the input amount; Core's WITNESS_V0 path."
  - id: g092
    q: "Where does a SegWit block commit to its witness data, and what happens if it doesn't match?"
    kind: covered
    expect: [segwit.witness-commitment]
    must: [segwit.witness-commitment]
    note: "In a coinbase output script; mismatch is rejected as bad-witness-merkle-match."
  - id: g093
    q: "In 2017, which locked in first, BIP 91 or SegWit's own deployment?"
    kind: covered
    expect: [segwit.bip91-outcome, segwit.bip9-deployment]
    must: [segwit.bip91-outcome]
    note: "Per Optech, BIP 91 locked in and activated first, then SegWit's BIP 9 deployment."
  - id: g094
    q: "Does Bitcoin Core relay a spend of a witness version that hasn't been defined yet?"
    kind: covered
    expect: [segwit.unknown-versions-policy, segwit.witness-versions-upgrade]
    must: [segwit.unknown-versions-policy]
    note: "Consensus accepts it, but policy flag DISCOURAGE_UPGRADABLE_WITNESS_PROGRAM makes it fail."
  - id: g095
    q: "Did BIP 148 force miners to activate SegWit?"
    kind: covered
    expect: [segwit.activation-causes-debated, segwit.bip91-outcome]
    must: [segwit.activation-causes-debated]
    note: "Debated per Optech; chain shows which blocks signaled, not why. No verdict."
  # covered: taproot
  - id: g096
    q: "What is Taproot and why was it added?"
    kind: covered
    expect: [taproot.what-it-is, taproot.why-it-was-added]
    must: [taproot.what-it-is]
    note: "2021 soft fork: outputs spendable by one signature or a committed condition; aims at privacy, efficiency."
  - id: g097
    q: "When did Taproot activate?"
    kind: covered
    expect: [taproot.activation-height, bip-process.taproot-activation]
    must: [taproot.activation-height]
    note: "Block 709,632, mined 14 November 2021."
  - id: g098
    q: "What is a pay-to-taproot address and how do I recognize one?"
    kind: covered
    expect: [taproot.bc1p-addresses]
    must: [taproot.bc1p-addresses]
    note: "P2TR addresses start with bc1p, are 62 characters, and use bech32m."
  - id: g099
    q: "If my Taproot wallet has a backup recovery script, can people see that it exists?"
    kind: covered
    expect: [taproot.key-path-hides-scripts, taproot.script-path-reveals-one]
    must: [taproot.key-path-hides-scripts]
    note: "Not on a key path spend; a script spend reveals only the used script and that a script path existed."
  - id: g100
    q: "With Taproot, does a 2-of-2 multisig look different on chain from a single-signer wallet?"
    kind: covered
    expect: [taproot.multisig-looks-single, taproot.schnorr-linearity]
    must: [taproot.multisig-looks-single]
    note: "With key aggregation such as MuSig2, one key and one signature, indistinguishable from single-sig."
  - id: g101
    q: "What are Schnorr signatures in Bitcoin and how big are they?"
    kind: covered
    expect: [taproot.bip340-schnorr, taproot.schnorr-linearity]
    must: [taproot.bip340-schnorr]
    note: "BIP 340: 64-byte signatures on secp256k1 against 32-byte x-only public keys."
  - id: g102
    q: "Which BIPs make up the Taproot upgrade?"
    kind: covered
    expect: [taproot.three-bips]
    must: [taproot.three-bips]
    note: "BIP 340 (Schnorr), BIP 341 (v1 spending rules), BIP 342 (Tapscript)."
  - id: g103
    q: "How was Taproot activated, and what share of blocks had to signal?"
    kind: covered
    expect: [taproot.speedy-trial, bip-process.taproot-activation, taproot.lock-in]
    must: [taproot.speedy-trial]
    note: "Speedy Trial, 90% (1,815 of 2,016) on bit 2 in 2021, min activation height 709,632."
  - id: g104
    q: "How long was the gap between Taproot locking in and taking effect?"
    kind: covered
    expect: [taproot.lock-in, taproot.activation-height]
    must: [taproot.lock-in]
    note: "Locked in June 2021, activated at block 709,632 on 14 November 2021, about five months."
  - id: g105
    q: "How do you write a threshold multisig in tapscript now that OP_CHECKMULTISIG is disabled?"
    kind: covered
    expect: [taproot.checksigadd]
    must: [taproot.checksigadd]
    note: "OP_CHECKSIGADD (0xba) checks one signature at a time and adds to a running count."
  - id: g106
    q: "What are OP_SUCCESS opcodes and why does tapscript have them?"
    kind: covered
    expect: [taproot.op-success]
    must: [taproot.op-success]
    note: "Reserved opcodes that make a script succeed outright, an upgrade path for new opcodes (BIP 342)."
  - id: g107
    q: "How does a node tell a Taproot key path spend from a script path spend?"
    kind: covered
    expect: [taproot.key-or-script-path, taproot.key-path-witness]
    must: [taproot.key-or-script-path]
    note: "Count witness elements after removing any annex: one is key path, two or more script path."
  - id: g108
    q: "Why does Bitcoin Core skip Taproot checks for block 692,261?"
    kind: covered
    expect:
      [taproot.exception-block, bip-process.taproot-always-enforced, taproot.buried-deployment]
    must: [taproot.exception-block]
    note: "It predates activation and fails Taproot rules; Core enforces Taproot on all other segwit blocks."
  - id: g109
    q: "How is a Taproot output key tied to its script tree, and where does Core check it?"
    kind: covered
    expect: [taproot.output-key-commitment, taproot.control-block]
    must: [taproot.output-key-commitment]
    note: "Internal key tweaked with the tree's Merkle root; VerifyTaprootCommitment recomputes it."
  - id: g110
    q: "Where in Bitcoin Core is the Taproot signature hash computed?"
    kind: covered
    expect: [taproot.sighash-trace]
    must: [taproot.sighash-trace]
    note: "SignatureHashSchnorr in src/script/interpreter.cpp, tagged hash TapSighash."
  # covered: utxo-model
  - id: g111
    q: "Does Bitcoin keep track of my balance like a bank account?"
    kind: covered
    expect: [utxo-model.wallet-balance, utxo-model.what-it-is]
    must: [utxo-model.wallet-balance]
    note: "No stored balance: it is the sum of unspent outputs a wallet can spend."
  - id: g112
    q: "What is a UTXO?"
    kind: covered
    expect: [utxo-model.what-it-is, utxo-model.spending-consumes-outputs]
    must: [utxo-model.what-it-is]
    note: "An unspent transaction output: an amount locked to a condition until a later tx spends it."
  - id: g113
    q: "Why did part of my payment go back to a new address of mine?"
    kind: covered
    expect: [utxo-model.change]
    must: [utxo-model.change]
    note: "That's change: inputs worth more than the payment return the remainder to the sender."
  - id: g114
    q: "Why did my wallet use several of my coins to make one payment?"
    kind: covered
    expect: [utxo-model.multiple-inputs, utxo-model.input-linking]
    must: [utxo-model.multiple-inputs]
    note: "No single output covered the amount, so coin selection combined several as inputs."
  - id: g115
    q: "How does Bitcoin stop someone spending the same coins twice without a central server?"
    kind: covered
    expect:
      [
        utxo-model.double-spend-check,
        utxo-model.confirmations,
        proof-of-work.attacker-must-redo-work,
      ]
    must: [utxo-model.double-spend-check]
    note: "Nodes reject txs spending missing or spent outputs; confirmations make reversal cost redone work."
  - id: g116
    q: "Why does my wallet show a fresh receive address every time?"
    kind: covered
    expect: [utxo-model.new-key-per-transaction, utxo-model.address-reuse]
    must: [utxo-model.new-key-per-transaction]
    note: "A new key per payment keeps payments from being linked to one owner; reuse links them."
  - id: g117
    q: "Someone sent a tiny amount of bitcoin to my address that I didn't ask for. What is that about?"
    kind: covered
    expect: [utxo-model.dust-attack, utxo-model.address-reuse]
    must: [utxo-model.dust-attack]
    note: "Possibly a dust attack, which targets output linking through reused addresses."
  - id: g118
    q: "What is the dust limit for a P2WPKH output in Bitcoin Core?"
    kind: covered
    expect: [utxo-model.dust-threshold]
    must: [utxo-model.dust-threshold]
