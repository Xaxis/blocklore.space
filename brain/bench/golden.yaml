    must: [utxo-model.utreexo]
    note: "Hash accumulator with inclusion proofs instead of the full set; draft BIPs say no soft fork needed."
  - id: g127
    q: "Why do blocks 91,842 and 91,880 get special treatment in Bitcoin Core?"
